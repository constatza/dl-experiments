[project]
name = "neuralls"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    #    "bokeh>=3.8.0",
    "dlkit",
    "loguru>=0.7.3",
    "numba>=0.63.1",
    "prefect-dask>=0.3.6",
    "pydantic>=2.12.5",
    "scipy-stubs==1.16.2.0",
    "seaborn>=0.13.2",
    "tcl>=0.2",
    "tomli-w>=1.0.0",
    "typer>=0.19.2",
]

[project.scripts]
compare-all = "neuralls.cli.compare_preconditioners:run"
generate-all     = "neuralls.cli.generate_multiple:run"
predict                 = "neuralls.cli.predict:run"
process-data            = "neuralls.cli.process_data:run"
run-experiments         = "neuralls.cli.run_experiments:run"
train-model             = "neuralls.cli.train_model:run"
train-all          = "neuralls.cli.train_multiple:run"

#[build-system]
#requires = ["setuptools>=61.0"]
#build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]  # Tells setuptools to look inside 'src'
include = ["*"]  # Includes all packages found in 'src'
namespaces = false # Set to true if you are using implicit namespace packages

[tool.ruff.lint]
extend-select = [
    "UP", # pyupgrade
    "D", # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "hypothesis>=6.151.6",
    "pyright>=1.1.407",
    "pytest>=9.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]
addopts = [
    "-m", "not benchmark",
]
markers = [
    "slow: tests that take >5 seconds (deselect with '-m \"not slow\"')",
    "benchmark: numerical algorithm benchmarks and exactness tests",
    "integration: integration tests that test full workflows",
]

[tool.uv]
package = true

[tool.uv.sources]
dlkit = { path = "../dlkit", editable = true }
