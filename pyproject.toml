[project]
name = "neuralls"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    #    "bokeh>=3.8.0",
    "dlkit",
    "loguru>=0.7.3",
    "numba>=0.63.1",
    "prefect-dask>=0.3.6",
    "pydantic>=2.12.5",
    "scipy-stubs==1.16.2.0",
    "seaborn>=0.13.2",
    "tcl>=0.2",
    "tomli-w>=1.0.0",
    "typer>=0.19.2",
]

[project.optional-dependencies]
cpu = ["torch>=2.8.0,<2.10.0"]
cu128 = ["torch>=2.8.0,<2.10.0"]
cu130 = ["torch>=2.8.0,<2.10.0"]

[project.scripts]
compare-all = "neuralls.cli.compare_preconditioners:run"
generate-all     = "neuralls.cli.generate_multiple:run"
predict                 = "neuralls.cli.predict:run"
process-data            = "neuralls.cli.process_data:run"
run-experiments         = "neuralls.cli.run_experiments:run"
train-model             = "neuralls.cli.train_model:run"
train-all          = "neuralls.cli.train_multiple:run"

#[build-system]
#requires = ["setuptools>=61.0"]
#build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]  # Tells setuptools to look inside 'src'
include = ["*"]  # Includes all packages found in 'src'
namespaces = false # Set to true if you are using implicit namespace packages

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "UP", # pyupgrade
    "D", # pydocstyle
]
ignore = [
    "D100", # undocumented-public-module
    "D101", # undocumented-public-class
    "D102", # undocumented-public-method
    "D103", # undocumented-public-function
    "D104", # undocumented-public-package
    "D107", # undocumented-public-init
    "D417", # undocumented-param
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"tests/**/__init__.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "hypothesis>=6.151.6",
    "pytest>=9.0",
    "ruff>=0.13.1",
    "tach>=0.34.0",
    "ty>=0.0.22",
]

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.src]
include = ["src/neuralls", "tests", "scripts"]
respect-ignore-files = true

[tool.ty.environment]
root = ["src", "."]
python-version = "3.14"
python-platform = "all"

[tool.ty.rules]
redundant-cast = "error"
unused-type-ignore-comment = "error"

[[tool.ty.overrides]]
include = ["tests"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-method-override = "ignore"
unknown-argument = "ignore"

[tool.ty.terminal]
output-format = "concise"
error-on-warning = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]
addopts = [
    "-m", "not benchmark",
]
markers = [
    "slow: tests that take >5 seconds (deselect with '-m \"not slow\"')",
    "benchmark: numerical algorithm benchmarks and exactness tests",
    "integration: integration tests that test full workflows",
]

[tool.uv]
package = true
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
dlkit = { git = "https://github.com/constatza/dlkit.git", rev = "c353207a0b2a508ca35012afe91d152ff3f0aacd" }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
