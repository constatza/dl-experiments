[project]
name = "experiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.1"
dependencies = [
    "dlkit",
    "scipy-stubs==1.16.2.0",
    "seaborn>=0.13.2",
    "tcl>=0.2",
    "typer>=0.17.4",
]

[tool.ruff.lint]
extend-select = [
    "UP", # pyupgrade
    "D", # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv.sources]
dlkit = { path = "../dlkit", editable = true }
