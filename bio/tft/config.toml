mlflow.enable = true
[mlflow.client]
experiment_name = "TFT"

[mlflow.server]
host = "localhost"
port = 35382
terminate_apps_on_port = true
# Storage paths now follow DLKit defaults based on DLKIT_ROOT_DIR:
# - backend: <root>/output/mlruns/mlflow.db
# - artifacts: <root>/output/mlartifacts/

[trainer]
max_epochs = 100
gradient_clip_val = 5
#fast_dev_run = true
enable_checkpointing = true

[[trainer.callbacks]]
name = "ModelCheckpoint"
filename = "tft"
monitor = "val_loss"
mode = "min"
save_top_k = 1
save_last = true
every_n_epoch = 10
enable_version_counter = false
dirpath = "./outputs/checkpoints"

[model]
name = "TemporalFusionTransformer"
module_path = "pytorch_forecasting"
hidden_size = 7
lstm_layers = 2
attention_head_size = 4
dropout = 0.1
log_interval = 5
predict = false
learning_rate = 1e-4
checkpoint = "./outputs/checkpoints/tft.ckpt"


[datamodule]
name = "TimeSeriesDataModule"
test_size = 0.15
validation_size = 0.15


[dataset]
name = "ForecastingDataset"
time_idx = "step"
max_encoder_length = 10
prediction_length = 3
target = "pc_1"
time_varying_unknown_reals = ["pc_0", "pc_1", "pc_2"]
time_varying_known_reals = ["time"]
static_reals = ["param_0", "param_1", "param_2"]
group_ids = ["sample"]

[dataloader]
num_workers = 30
batch_size = 1000
persistent_workers = true
pin_memory = true

# PATHS removed. Use DLKIT_ROOT_DIR for base. Conventional locations:
# - Input files under ./input (relative to root)
# - Outputs under ./outputs (relative to root)
# Example inputs used by helper scripts:
# features = "./input/pca.parquet"
# parameters = "./input/parameters.npy"
# time = "./input/timeStepTotalTimes.txt"
# idx_split = "./input/idx_split.json"
