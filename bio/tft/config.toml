[mlflow.client]
experiment_name = "TFT"

[mlflow.server]
host = "localhost"
port = 35382
backend_store_uri = "sqlite:///M:/constantinos/data/bio/5-equations/mlruns/mlflow.db"
default_artifact_root = "file:///M:/constantinos/data/bio/5-equations/mlruns/artifacts"
terminate_apps_on_port = true

[trainer]
max_epochs = 300
gradient_clip_val = 5
#fast_dev_run = true
#accelerator = "cpu"
enable_checkpointing = true

[[trainer.callbacks]]
name = "ModelCheckpoint"
filename = "tft"
monitor = "val_loss"
mode = "min"
save_top_k = 1
save_last = true
every_n_epoch = 10
enable_version_counter = false
dirpath = "@format {this.paths.output_dir}\\checkpoints"

[model]
name = "TemporalFusionTransformer"
module_path = "pytorch_forecasting"
learning_rate = 0.01
hidden_size = 256
attention_head_size = 8
dropout = 0
log_interval = 50
reduce_on_plateau_patience = 5

[model.optimizer]
name = "RAdam"
lr = 0.001
weight_decay = 8e-6

[model.scheduler]
name = "ReduceLROnPlateau"
factor = 0.8
patience = 10
min_lr = 1e-5

# TODO: add configurable loss functions for forecasting

[datamodule]
name = "TimeSeriesDataModule"
test_size = 0.2
validation_size = 0.2


[dataset]
name = "ForecastingDataset"
time_idx = "step"
encoder_length = 9
prediction_length = 3
target = ["pc_0", "pc_1"]
time_varying_known_reals = ["time"]
static_reals = ["param_0", "param_1", "param_2"]
group_ids = ["sample"]

[dataloader]
num_workers = 5
batch_size = 1024
persistent_workers = true
pin_memory = true

[paths]
root = "M:\\constantinos\\data\\bio\\5-equations"
input_dir = "M:\\constantinos\\data\\bio\\5-equations\\input"
output_dir = "@format {this.paths.root}\\output"
features = "@format {this.paths.input_dir}\\pca.parquet"
parameters = "@format {this.paths.input_dir}\\parameters.npy"
time = "@format {this.paths.input_dir}\\timeStepTotalTimes.txt"
idx_split = "@format {this.paths.input_dir}\\idx_split.json"
