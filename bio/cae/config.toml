[run]
name = "Bio"
mode = "mlflow"

[mlflow.client]
experiment_name = "@format CAE({this.run.name})"

[mlflow.server]
backend_store_uri = "@format sqlite:///{this.paths.mlruns_dir}/mlflow.db"
artifacts_destination = "@format file:///{this.paths.mlruns_dir}/artifacts"

[trainer]
max_epochs = 450
enable_checkpointing = true
#grad_clip_norm = 0.01

[[trainer.callbacks]]
name = "NumpyWriter"
module_path = "dlkit.callbacks"
output_dir = "@format {this.paths.output_dir}"
filenames = ["predictions", "latent"]

[[trainer.callbacks]]
name = "ModelCheckpoint"
dirpath = "@format {this.paths.output_dir}"
filename = "cae"
save_top_k = 1
save_weights_only = true
every_n_epoch = 10
enable_version_counter = false
monitor = "val_loss"

[model]
name = "cae.SkipCAE1d"
num_layers = 7
latent_size = 4
kernel_size  = 3
latent_channels = 300
latent_width = 5
dilation = 3
#dropout = 0.1
is_autoencoder = true

[model.optimizer]
name = "RAdam"
lr = 1e-3

[model.scheduler]
name = "ReduceLROnPlateau"
factor = 0.5
patience = 15
min_lr = 1e-6

[[model.feature_transforms]]
name = "MinMaxScaler"
dim = [0, -1]


[[model.metrics]]
name = "MeanAbsolutePercentageError"

[datamodule]
val_size = 0.15
test_size = 0.15

[dataset]
name = "NumpyDataset"

[dataloader]
num_workers = 5
batch_size = 64
persistent_workers = true
pin_memory = true


[paths]
root = "M:\\constantinos\\data\\bio\\5-equations"
input_dir = "M:\\constantinos\\data\\bio\\5-equations\\input"
features = "@format {this.paths.input_dir}\\p.npy"
output_dir = "@format {this.paths.root}\\output"
predictions_dir = "@format {this.paths.output_dir}"
mlruns_dir = "@format {this.paths.output_dir}\\mlruns"
latent = "@format {this.paths.output_dir}\\latent.npy"
figures = "@format {this.paths.output_dir}\\figures\\"
parameters = "@format {this.paths.input_dir}\\parameters.npy"
predictions = "@format {this.paths.predictions_dir}\\p-predictions.npy"
idx_split = "@format {this.paths.input_dir}\\idx_split.json"
checkpoint_dir = "@format {this.paths.output_dir}\\checkpoints\\"
