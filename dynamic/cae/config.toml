[run]
name = "E=22E6, ω=5, dt=0.01, KLterms=1, sin"
mode = "mlflow"

[mlflow.client]
experiment_name = "@format CAE({this.run.name})"

[mlflow.server]
# Storage paths now follow DLKit defaults based on DLKIT_ROOT_DIR:
# - backend: <root>/output/mlruns/mlflow.db
# - artifacts: <root>/output/mlartifacts/

[trainer]
max_epochs = 500
enable_checkpointing = true
grad_clip_norm = 0.01

[[trainer.callbacks]]
name = "NumpyWriter"
module_path = "dlkit.callbacks"
output_dir = "./outputs"
filenames = ["predictions", "latent"]

[[trainer.callbacks]]
name = "ModelCheckpoint"
dirpath = "./outputs"
filename = "cae"
save_top_k = 1
save_weights_only = true
every_n_epoch = 10
enable_version_counter = false
monitor = "val_loss"

[model]
name = "cae.VAE1d"
num_layers = 3
latent_size = 2
kernel_size  = 5
latent_channels = 50
latent_width = 20
#dropout = 0.1
is_autoencoder = true

[model.optimizer]
name = "RAdam"
lr = 1e-3

[model.scheduler]
name = "ReduceLROnPlateau"
factor = 0.5
patience = 15
min_lr = 1e-6

[[model.feature_transforms]]
name = "MinMaxScaler"
dim = [0, -1]

[[model.metrics]]
name = "MeanAbsolutePercentageError"

[datamodule]
val_size = 0.15
test_size = 0.15

[dataset]
name = "NumpyDataset"

[dataloader]
num_workers = 5
batch_size = 64
persistent_workers = true
pin_memory = true


# PATHS removed. Use DLKIT_ROOT_DIR for base. Conventional locations:
# - Input under ./input, outputs under ./outputs
