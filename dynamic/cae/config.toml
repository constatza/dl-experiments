[mlflow.client]
experiment_name = "cae"

[mlflow.server]
host = "localhost"
port = 10001
backend_store_uri = "sqlite:///M:/constantinos/data/dynamic/mlruns/mlflow.db"
artifacts_destination = "file:///M:/constantinos/data/dynamic/mlruns/artifacts"

[trainer]
max_epochs = 400
enable_checkpointing = true
#fast_dev_run = true
accelerator = "cpu"

[[trainer.callbacks]]
name = "NumpyWriter"
module_path = "dlkit.callbacks"
output_dir = "@format {this.paths.output_dir}"
filenames = ["predictions", "predictions_latent"]

[[trainer.callbacks]]
name = "ModelCheckpoint"
dirpath = "@format {this.paths.output_dir}"
filename = "cae"
save_top_k = 1
save_weights_only = true
every_n_epoch = 50
enable_version_counter = false

[model]
name = "cae.SkipCAE1d"
latent_channels = {low=6, high=200}
latent_width = {low=1, high=200}
latent_size = {low=3, high=12}
num_layers = {low=1, high=6, step=1}
kernel_size = {low=3, high=11, step=2}
is_autoencoder = true
predict = false

[model.optimizer]
name = "RAdam"
lr = 0.001

[model.scheduler]
name = "ReduceLROnPlateau"
factor = 0.6
patience = 10
min_lr = 1e-6

[[model.feature_transforms]]
name = "MinMaxScaler"
dim = [0, -1]

[model.train_loss]
name = "mse_loss"
module_path = "torch.nn.functional"


[datamodule]
val_size = 0.15
test_size = 0.15

[dataset]
name = "NumpyDataset"

[dataloader]
num_workers = 5
batch_size = 128
persistent_workers = true
pin_memory = true

[optuna]
n_trials = 150

[optuna.pruner]
name = "MedianPruner"
n_startup_trials=5
n_warmup_steps=30
interval_steps=10



[paths]
root = "M:\\shared\\Serafeim_Atzarakis\\results\\CantileverDynamicLinear"
input_dir = "@format {this.paths.root}"
output_dir = "@format {this.paths.root}"
predictions_dir = "@format {this.paths.output_dir}"
features = "@format {this.paths.input_dir}\\train_solutions.npy"
parameters = "@format {this.paths.input_dir}\\train_model_params.npy"
latent = "@format {this.paths.output_dir}\\predictions_latent.npy"
idx_split = "@format {this.paths.input_dir}\\idx_split.json"
