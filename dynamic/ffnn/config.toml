[run]
name = "E=22E6, ω=5, dt=0.01, KLterms=1, sin"
#mode = "mlflow"

[mlflow.client]
experiment_name = "@format FFNN({this.run.name})"

[mlflow.server]
# Storage paths now follow DLKit defaults based on DLKIT_ROOT_DIR:
# - backend: <root>/output/mlruns/mlflow.db
# - artifacts: <root>/output/mlartifacts/

[trainer]
max_epochs = 300
enable_checkpointing = true
gradient_clip_value = 2
fast_dev_run = true

[[trainer.callbacks]]
name = "NumpyWriter"
module_path = "dlkit.callbacks"
output_dir = "./outputs"
filenames = ["predictions_latent"]

[[trainer.callbacks]]
name = "ModelCheckpoint"
dirpath = "./outputs"
filename = "ffnn"
monitor = "val_loss"
save_top_k = 1
save_weights_only = true
every_n_epoch = 50
enable_version_counter = false

[model]
name = "ConstantWidthFFNN"
module_path = "dlkit.nn.ffnn"
hidden_size = 50
num_layers = 6
#dropout = 0.1

[model.loss_function]
name = "mse_loss"
module_path = "torch.nn.functional"

[model.optimizer]
name = "RAdam"
lr = 5e-2

[model.scheduler]
name = "ReduceLROnPlateau"
factor = 0.5
patience = 20
min_lr = 1e-6

[[model.feature_transforms]]
name = "MinMaxScaler"

[[model.metrics]]
name = "MeanAbsolutePercentageError"

[dataset]
x = "./input/train_model_params.npy"
y = "./outputs/latent.npy"

[datamodule]
val_size = 0.15
test_size = 0.15


[dataloader]
num_workers = 5
batch_size = 256
persistent_workers = true
pin_memory = true

# PATHS removed. Use DLKIT_ROOT_DIR for base. Conventional locations:
# - Input under ./input, outputs under ./outputs
# predictions = "./outputs/predictions_latent.npy"
# idx_split = "./input/idx_split.json"
# checkpoint = "./outputs/ffnn.ckpt"

[optuna]
n_trials = 3

[optuna.model]
hidden_size = {low=5, high=1000, step= 100}
num_layers = {low=1, high=8, step=1}
normalize = {choices=["none", "layer", "batch"]}
drop = {low=0, high=0.5, step=0.1}
