[mlflow.client]
experiment_name = "ffnn"

[mlflow.server]
host = "localhost"
port = 10001
backend_store_uri = "sqlite:///M:/constantinos/data/dynamic/mlruns/mlflow.db"
artifacts_destination = "file:///M:/constantinos/data/dynamic/mlruns/artifacts"

[trainer]
max_epochs = 500
enable_checkpointing = true
#fast_dev_run = true
#accelerator = "cpu"

[[trainer.callbacks]]
name = "NumpyWriter"
module_path = "dlkit.callbacks"
output_dir = "@format {this.paths.output_dir}"
filenames = ["predictions_latent"]

[[trainer.callbacks]]
name = "ModelCheckpoint"
dirpath = "@format {this.paths.output_dir}"
filename = "ffnn"
save_top_k = 1
save_weights_only = true
every_n_epoch = 50
enable_version_counter = false


[model]
name = "ConstantWidthFFNN"
module_path = "dlkit.networks.ffnn"
hidden_size = 7
num_layers = 1

[model.optimizer]
name = "RAdam"
lr = 0.001

[model.scheduler]
name = "ReduceLROnPlateau"
factor = 0.8
patience = 12
min_lr = 1e-5

[[model.feature_transforms]]
name = "MinMaxScaler"

[model.train_loss]
name = "mse_loss"
module_path = "torch.nn.functional"


[datamodule]
val_size = 0.15
test_size = 0.15

[dataset]
name = "NumpyDataset"

[dataloader]
num_workers = 5
batch_size = 128
persistent_workers = true
pin_memory = true

[paths]
root = "M:\\shared\\Serafeim_Atzarakis\\results\\CantileverDynamicLinear"
input_dir = "@format {this.paths.root}"
output_dir = "@format {this.paths.root}"
predictions_dir = "@format {this.paths.output_dir}"
features = "@format {this.paths.input_dir}\\train_model_params.npy"
targets = "@format {this.paths.output_dir}\\latent.npy"
predictions = "@format {this.paths.predictions_dir}\\predictions_latent.npy"
idx_split = "@format {this.paths.input_dir}\\idx_split.json"
