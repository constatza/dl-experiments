name = "E=22E6, ω=5, dt=0.01, KLterms=1"
mlflow.enable = true
[mlflow.client]
experiment_name = "@format FFNN({this.name})"

[mlflow.server]
backend_store_uri = "sqlite:///M:/constantinos/data/dynamic/mlruns/mlflow.db"
artifacts_destination = "file:///M:/constantinos/data/dynamic/mlruns/artifacts"

[trainer]
max_epochs = 500
enable_checkpointing = true

[[trainer.callbacks]]
name = "NumpyWriter"
module_path = "dlkit.callbacks"
output_dir = "@format {this.paths.output_dir}"
filenames = ["predictions_latent_ffnn"]


[model]
name = "ConstantWidthFFNN"
module_path = "dlkit.networks.ffnn"
hidden_size = 100
num_layers = 5
checkpoint_monitor = "val_loss"
checkpoint = "@format {this.paths.output_dir}\\ffnn.ckpt"
train = false
test = false
predict = false


[[model.feature_transforms]]
name = "MinMaxScaler"


[datamodule]
val_size = 0.15
test_size = 0.15

[dataset]
name = "NumpyDataset"

[dataloader]
num_workers = 5
batch_size = 256
persistent_workers = true
pin_memory = true

[paths]
root = "M:\\shared\\Serafeim_Atzarakis\\results\\CantileverDynamicLinear\\"
input_dir = "@format {this.paths.root}\\python_experimenting\\{this.name}"
output_dir = "@format {this.paths.root}"
mlruns_dir = "M:\\constantinos\\data\\dynamic\\mlruns"
predictions_dir = "@format {this.paths.output_dir}"
features = "@format {this.paths.input_dir}\\train_model_params.npy"
targets = "@format {this.paths.output_dir}\\predictions_latent.npy"
predictions = "@format {this.paths.predictions_dir}\\predictions_latent_ffnn.npy"
idx_split = "@format {this.paths.input_dir}\\idx_split.json"
