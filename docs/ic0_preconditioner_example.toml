# IC(0) Preconditioner Configuration Example
#
# IC(0) (Incomplete Cholesky, zero-level) is a preconditioner for symmetric
# positive definite (SPD) systems. It computes an incomplete Cholesky factorization
# L such that L @ L.T ≈ A, where L maintains the sparsity pattern of the lower
# triangle of A.
#
# Best suited for:
# - Sparse symmetric positive definite matrices
# - Problems where structure preservation is important
# - Systems where ILU is too expensive but Jacobi insufficient
#
# For dense SPD matrices, consider using full Cholesky factorization instead.

# Example 1: IC(0) with default threshold (recommended)
[preconditioner]
name = "ic0_default"
type = "ic0"
# threshold = 1e-14  # Optional: default value shown
# Entries with |value| < threshold are treated as zeros
# This improves numerical stability and maintains sparsity

# Example 2: IC(0) with strict threshold (more fill-in, better approximation)
# [preconditioner]
# name = "ic0_strict"
# type = "ic0"
# threshold = 1e-16
# Smaller threshold = more fill-in, better approximation of A
# Use when you need highest accuracy and can afford more memory

# Example 3: IC(0) with aggressive threshold (maximum sparsity)
# [preconditioner]
# name = "ic0_aggressive"
# type = "ic0"
# threshold = 1e-10
# Larger threshold = more sparsity, faster but less accurate
# Use for very large systems where memory is constrained

# Example 4: IC(0) with iteration limit (for scheduled preconditioning)
# [preconditioner]
# name = "ic0_scheduled"
# type = "ic0"
# threshold = 1e-14
# limit_iters = 10  # Apply IC(0) only for first 10 iterations
# fallback = "jacobi"  # Switch to Jacobi after limit_iters

# Threshold tuning guidelines:
# - Default (1e-14): Balance between stability and sparsity (recommended)
# - Strict (1e-16): Minimal dropping, preserves more information, denser L
# - Moderate (1e-12): Good for matrices with numerical noise
# - Aggressive (1e-10 to 1e-8): Maximum sparsity, faster but less accurate
#
# Trade-off: Smaller threshold = better approximation but more fill-in and memory

# Performance comparison (typical for tridiagonal SPD n=50):
# - Identity: ~30-50 iterations
# - Jacobi: ~15-20 iterations
# - IC(0): ~1-5 iterations (often converges in 1!)
# - ILU: ~1-5 iterations (similar to IC(0) for SPD)
#
# Note: For SPD matrices, IC(0) is often preferable to ILU because:
# 1. Exploits symmetry (only stores L, not both L and U)
# 2. More numerically stable for SPD systems
# 3. Often faster factorization time
