# Test config: Eigenvector-based RHS generation
# Uses eigenvectors as RHS, solutions computed as x = A^-1 @ v (inverse mode)
# Useful for testing CG performance with high-precision eigenvector-based problems
#
# Usage: uv run python graph-cg/scripts/process_data.py data-configs/test-eigenvector-rhs.toml
# Output: test-eigenvalue-rhs-{normalization}/

[flow]

[source]
matrix_path = "/data/projects/graph-cg/data/raw/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
# Spectral normalization preserves eigenvalue properties
normalize = "matrix"
shuffle = true
seed = 42
residual_iters = 1  # Target CG iterations for neural preconditioner training

# Use all eigenvectors as RHS, solutions = A^-1 @ eigenvector
[[generation.strategy]]
name = "eigenvector_inverse"
which = "largest"
num_eigenvectors = "100"
samples =  6000 # Use all eigenvectors (504-dimensional system)

[output]
processed_dir = "/data/projects/graph-cg/data/processed"
