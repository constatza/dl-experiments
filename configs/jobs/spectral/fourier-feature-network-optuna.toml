[run]
type = "search"
seed = 42
precision = "64"
model = "../../profiles/model/spectral/fourier-feature-network.toml"
data = "../../profiles/data/array-default.toml"
training = "../../profiles/training/default.toml"
plots = "../../profiles/plots/default.toml"

[search]
objective = "val/loss"

[search.space]
"training.optimizer.default_optimizer.lr" = { type = "log_float", low = 1e-5, high = 1e-2 }
