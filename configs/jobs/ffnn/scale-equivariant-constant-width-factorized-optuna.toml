[run]
type = "search"
seed = 42
precision = "64"
model = "../../profiles/model/ffnn/scale-equivariant-constant-width-factorized.toml"
data = "../../profiles/data/array-default.toml"
training = "../../profiles/training/default.toml"
plots = "../../profiles/plots/default.toml"

[search]
objective = "val_loss"
n_trials = 40
space."training.optimizer.default_optimizer.lr" = { type = "log_float", low = 1e-5, high = 1e-1 }
space."model.num_layers" = { type = "int", low = 1, high = 6 }
space."model.activation" = { type = "categorical", choices = ["relu", "gelu", "silu", "tanh", "leaky_relu"] }
space."model.dropout" = { type = "float", low = 0.0, high = 0.2 }
space."model.bias" = { type = "categorical", choices = [true, false] }
space."model.std" = { type = "log_float", low = 1e-3, high = 2e-1 }
space."model.eps_gain" = { type = "float", low = 1.0, high = 20.0 }
