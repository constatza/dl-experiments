[run]
type = "search"
seed = 42
precision = "64"
model = "../../profiles/model/ffnn/scale-equivariant-constant-width-factorized.toml"
data = "../../profiles/data/array-default.toml"
training = "../../profiles/training/default.toml"
plots = "../../profiles/plots/default.toml"

[search]
objective = "val/loss"
n_trials = 40

[search.space]
"training.optimizer.default_optimizer.lr" = { type = "log_float", low = 1e-5, high = 1e-1 }
"model.num_layers" = { type = "int", low = 1, high = 6 }
"model.activation" = { type = "categorical", choices = ["relu", "gelu", "silu", "tanh", "leaky_relu"] }
"model.dropout" = { type = "float", low = 0.0, high = 0.2 }
"model.bias" = { type = "categorical", choices = [true, false] }
