# Residual linear registry for archive-backed and Gaussian residual sweeps.

[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train"
comparison = "Comparisons"

# ────────────────────────
# Comparison defaults
# ────────────────────────

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ───────────────────────
# Datasets
# ───────────────────────

[[datasets]]
id   = "residuals-100"
path = "datasets/residuals-100.toml"
display_name = "Residual-Error 100"

[[datasets]]
id   = "res-gaussian-100"
path = "datasets/res-gaussian-100.toml"
display_name = "Residual-Error 100 Gaussian"

[[datasets]]
id   = "res-gaussian-0"
path = "datasets/res-gaussian-0.toml"
display_name = "Residual-Error 0 Gaussian"

[[datasets]]
id   = "res-gaussian-10"
path = "datasets/res-gaussian-10.toml"
display_name = "Residual-Error 10 Gaussian"

[[datasets]]
id   = "res-gaussian-20"
path = "datasets/res-gaussian-20.toml"
display_name = "Residual-Error 20 Gaussian"

[[datasets]]
id   = "res-gaussian-50"
path = "datasets/res-gaussian-50.toml"
display_name = "Residual-Error 50 Gaussian"

[[datasets]]
id   = "res-gaussian-100-93x31"
path = "datasets/res-gaussian-100-93x31.toml"
display_name = "Residual-Error 100 Gaussian 93x31"

[[datasets]]
id   = "solutions"
path = "datasets/solutions.toml"
display_name = "Solutions"

[[datasets]]
id   = "gaussian-rhs"
path = "datasets/gaussian-rhs.toml"
display_name = "Gaussian RHS"

[[datasets]]
id   = "scaled-solutions"
path = "datasets/scaled-solutions.toml"
display_name = "Scaled Solutions"

[[datasets]]
id   = "sparse-rhs"
path = "datasets/sparse-rhs.toml"
display_name = "Sparse RHS"

[[datasets]]
id   = "eig-few-solutions-largest"
path = "datasets/eig-few-solutions-largest.toml"
