# Residual linear registry for archive-backed and Gaussian residual sweeps.

[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train"
comparison = "Comparisons"

# -------
# Dataset
# -------

[[datasets]]
id = "residuals-100"
path = "datasets/residuals-100.toml"
display_name = "Residual-Error 100"

[[datasets]]
id = "res-gaussian-100"
path = "datasets/res-gaussian-100.toml"
display_name = "Residual-Error 100 Gaussian"

[[datasets]]
id = "res-gaussian-0"
path = "datasets/res-gaussian-0.toml"
display_name = "Residual-Error 0 Gaussian"

[[datasets]]
id = "res-gaussian-10"
path = "datasets/res-gaussian-10.toml"
display_name = "Residual-Error 10 Gaussian"

[[datasets]]
id = "res-gaussian-20"
path = "datasets/res-gaussian-20.toml"
display_name = "Residual-Error 20 Gaussian"

[[datasets]]
id = "res-gaussian-50"
path = "datasets/res-gaussian-50.toml"
display_name = "Residual-Error 50 Gaussian"

[[datasets]]
id = "res-gaussian-100-93x31"
path = "datasets/res-gaussian-100-93x31.toml"
display_name = "Residual-Error 100 Gaussian 93x31"

# ------
# Models
# ------

[[models]]
id = "linear"
path = "models/linear/linear.toml"
display_name = "Linear"

# -----------
# Experiments
# -----------

[[experiments]]
id = "residuals"
dataset = "residuals-100"
model = "linear"
display_name = "Residual-Error"

[[experiments]]
id = "res-gaussian-100-linear"
dataset = "res-gaussian-100"
model = "linear"
display_name = "Residual-Error Gaussian"

# -----------
# Comparisons
# -----------

[[comparisons]]
id = "gaussian"
path = "comparison/gaussian.toml"
display_name = "Gaussian RHS"

[[comparisons]]
id = "scaled-solutions"
path = "comparison/scaled-solutions.toml"
display_name = "Scaled Spectral Comparison"

[[comparisons]]
id = "sparse-rhs"
path = "comparison/sparse-rhs.toml"
display_name = "Sparse RHS Comparison"

[[comparisons]]
id = "eig-few-solutions-largest"
path = "comparison/eig-few-solutions-largest.toml"
display_name = "Eig Few Sol Largest Comparison"

[[comparisons]]
id = "eig-few-solutions-smallest"
path = "comparison/eig-few-solutions-smallest.toml"
display_name = "Eig Few Sol Smallest Comparison"

[[comparisons]]
id = "eig-few-rhs-largest"
path = "comparison/eig-few-rhs-largest.toml"
display_name = "Eig Few RHS Largest Comparison"

[[comparisons]]
id = "eig-few-rhs-smallest"
path = "comparison/eig-few-rhs-smallest.toml"
display_name = "Eig Few RHS Smallest Comparison"
