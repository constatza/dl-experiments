id = "gaussian-rhs-45x15"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_inverse"
samples = 10000
mu = 0.0
sigma = 1.0

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
