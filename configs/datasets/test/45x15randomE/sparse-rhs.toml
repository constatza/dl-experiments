id = "sparse-rhs-45x15randomE"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/45x15randomE/stiffness/*_subdomain_1_Kaa.txt"
enumerate_by = "name"

[generation]
normalize = "matrix"
shuffle = false
seed = 42

[[generation.strategy]]
name = "sparse_rhs"
samples = 1000
indices = [0, 1, -1]
values = [90.0, 100.0, -100.0]

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
