id = "scaled-solutions-45x15randomE"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/45x15randomE/stiffness/*_subdomain_1_Kaa.txt"
enumerate_by = "name"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "scaled_solutions"
samples = -1
scale = 5.0
solutions_glob = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_*.txt"

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
