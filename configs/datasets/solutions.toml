# Test config: Pure solution archive collection (all avae lable solutions)
# Uses 45x15-displacements UaVectors with pure collection - no synthetic generation
# Pure solution-to-RHS mapping: b = A @ x for each solution vector
#
# Usage: uv run python src/neuralls/cli/process_data.py configs/datasets/solutions.toml
# Output: solutions-{normalization}/


[source]
matrix_path = "${GRAPH_CG_RAW_DIR}/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"
solutions_path = "${GRAPH_CG_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_*.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

# Pure solution archive strategy: collect ALL available solution vectors
[[generation.strategy]]
name = "solution_archive"
samples = -1  # Use all available solutions
solutions_glob = "${GRAPH_CG_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_*.txt"

[output]
data_dir = "${GRAPH_CG_PROCESSED_DIR}"
