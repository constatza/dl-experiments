# Solution archive config conjugate to spectral 45×15 data: uses displacement (x) vectors to synthesize RHS.
# Uses cg_residual_error strategy to generate residual-error trace pairs for preconditioner training
#
# Data generation process:
# 1. Loads true solutions x* from archive
# 2. Computes RHS as b = A @ x*
# 3. Runs scipy classical CG for 50 iterations starting from x_0 = 0
# 4. Collects (r_k, e_k) pairs at each iteration where:
#    - r_k = residual vector at iteration k
#    - e_k = error correction = x* - x_k
#    - Mathematical relationship: r_k = A @ e_k (valid (A@x, x) format!)
#
# Training pairs: (r_k, e_k) where r_k is input, e_k is target
# Network learns: e_k ≈ A^-1 @ r_k (preconditioner application)

[flow]

[source]
matrix_path = "/data/projects/graph-cg/data/raw/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "cg_residual_error"
samples = 200            # Base systems (solution files to load)
                         # Total pairs = 200 × 50 = 10000
cg_iters = 50            # CG iterations per base system
solutions_glob = "/data/projects/graph-cg/data/raw/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_*.txt"

#[[generation.strategy]]
#name = "cg_residual"
#samples = 10000
#residual_iters = 250
## No solutions_glob - uses random generation mode

[output]
processed_dir = "/data/projects/graph-cg/data/processed"

