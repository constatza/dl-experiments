# Test config: Eigenvector-based solution generation (smallest eigenvalues)
# Uses eigenvectors as solutions, RHS computed as b = λ * v (forward mode)
# Useful for testing CG performance with high-precision eigenvector-based problems
#
# Usage: uv run python src/neuralls/cli/process_data.py configs/datasets/eigenvector-solutions-smallest.toml
# Output: eigenvector-solutions-smallest-{normalization}/

id = "eigenvector-solutions-smallest"

[source]
matrix_path = "/data/projects/graph-cg/raw/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
# Spectral normalization preserves eigenvalue properties
normalize = "matrix"
shuffle = true
seed = 42

# Use smallest eigenvectors as solutions, RHS = eigenvalue * eigenvector
[[generation.strategy]]
name = "eigenvector_forward"
which = "smallest"
num_eigenvectors = 100
samples = 6000

[output]
data_dir = "/data/projects/graph-cg/processed"
