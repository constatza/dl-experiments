id = "gaussian-cg100-45x15"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_residuals"
samples = 12500
cg_iters = 100

[[generation.strategy]]
name = "gaussian_forward"
samples = 12500
seed = 43

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
