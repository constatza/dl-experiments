id = "gaussian-cg1-spheres-rve-high-condition-2000"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/matrices/spheres-rve-high-condition.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

# "0 CG iterations": cg_iters on the residuals/trace strategies has a hard
# floor of 1 (and even cg_iters=1 emits 2 rows per system - iteration 0 AND
# iteration 1, not just the plain solution). gaussian_forward is the true
# zero-CG-iteration case - x ~ N(mu, sigma), b = A @ x, no CG solve at all.
# POD-2G fitting never sees real archived solutions - those are comparison-only.
[[generation.strategy]]
name = "gaussian_forward"
samples = 2000

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
