id = "gaussian-cg100-45x15randomE"

[source]
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/45x15randomE/stiffness/*_subdomain_1_Kaa.txt"
enumerate_by = "name"
parameters_paths = [
  "${NEURALLS_RAW_DIR}/SpectralData/45x15randomE/parameters/*_E_params.txt",
]

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_residuals"
samples = 10000
cg_iters = 100

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
