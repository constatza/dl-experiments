# Test config: Eigenvector-based inverse generation
# Uses eigenvectors as RHS, solves A^-1 @ v for solutions (inverse mode)
# Mirrors the forward eigenvector setup but flips RHS/solution roles
#
# Usage: uv run python graph-cg/scripts/process_data.py data-configs/test-eigenvector-inverse.toml
# Output: test-eigenvector-inverse-{normalization}/

[flow]

[source]
matrix_path = "/data/projects/graph-cg/data/raw/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
# Spectral normalization preserves eigenvalue properties
normalize = "matrix"
shuffle = true
seed = 42

# Use eigenvectors as RHS, solutions solved via inverse mode
[[generation.strategy]]
name = "eigenvector_inverse"
which = "largest"
num_eigenvectors = 10
samples = 6000

[output]
processed_dir = "/data/projects/graph-cg/data/processed"
