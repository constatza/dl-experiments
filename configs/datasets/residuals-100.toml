# Solution archive residual-error trace config using the same spectral solution registry as solutions.toml
# Loads archived true solutions x*, computes b = A @ x*, then collects 100 CG steps of:
#   residual = r_k
#   dx = e_k = x* - x_k
# This yields valid (A @ dx, dx) training pairs for preconditioner learning.
#
# Usage: uv run python src/neuralls/cli/process_data.py configs/datasets/solutions-residual-error-100.toml
# Output: solutions-residual-error-100-{normalization}/


[source]
matrix_path = "/data/projects/graph-cg/raw/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"
solutions_path = "/data/projects/graph-cg/raw/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_*.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

# Residual-error trace strategy: use the archived solution registry and size the
# number of base systems from the desired trace-row budget using integer division.
[[generation.strategy]]
name = "cg_residual_error"
samples = 10000
cg_iters = 100
solutions_glob = "/data/projects/graph-cg/raw/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_*.txt"

[output]
data_dir = "/data/projects/graph-cg/processed"
