# Neutral test dataset: x=ones, b=A@x for unbiased baseline
# Provides consistent neutral baseline for solver comparison across experiments
#
# This dataset contains a single test case where:
# - Solution x = ones (all entries are 1.0)
# - RHS b = A @ x (computed from matrix-vector product)
# - No synthetic complexity, pure baseline test
#
# Usage: uv run python src/neuralls/cli/process_data.py configs/datasets/neutral-45x15-displacements.toml
# Output: neutral/neutral-45x15-displacements/

id = "neutral-45x15-displacements"

[source]
matrix_path = "/data/projects/graph-cg/raw/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
normalize = "matrix"  # Match training normalization for consistency
shuffle = false       # No shuffle needed for single deterministic sample
seed = 42

# Neutral ones strategy: generates x=ones, b=A@x
[[generation.strategy]]
name = "neutral_ones"
samples = 1  # Single neutral test case

[output]
data_dir = "/data/projects/graph-cg/processed"
