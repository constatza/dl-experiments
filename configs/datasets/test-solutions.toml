# Test config: Pure solution archive collection (all avae lable solutions)
# Uses 45x15-displacements UaVectors with pure collection - no synthetic generation
# Pure solution-to-RHS mapping: b = A @ x for each solution vector
#
# Usage: uv run python src/neuralls/cli/process_data.py data-configs/test-solutions.toml
# Output: test-solutions-{normalization}/

[flow]

[source]
matrix_path = "/data/projects/graph-cg/data/raw/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"
solutions_path = "/data/projects/graph-cg/data/raw/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_*.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

# Pure solution archive strategy: collect ALL available solution vectors
[[generation.strategy]]
name = "solution_archive"
samples = -1  # Use all available solutions
solutions_glob = "/data/projects/graph-cg/data/raw/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_*.txt"

[output]
processed_dir = "/data/projects/graph-cg/data/processed"
