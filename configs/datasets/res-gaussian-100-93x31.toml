id = "res-gaussian-100-93x31"

# Residual-error trace dataset built from Gaussian N(0, 1) true solutions on
# the larger 93x31 displacement matrix.
# Samples x_true ~ N(0, I), computes b = A @ x_true, then records:
#   residual = r_k
#   dx = x_true - x_k
# at each CG iteration. The persisted training pairs therefore satisfy r_k = A @ dx_k.
#
# Usage: uv run python src/neuralls/cli/process_data.py configs/datasets/res-gaussian-100-93x31.toml
# Output: res-gaussian-100-93x31-{normalization}/

[source]
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/93x31-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

# Gaussian residual-error trace strategy: use random N(0, 1) true solutions and
# size the number of base systems from the desired trace-row budget using integer division.
[[generation.strategy]]
name = "gaussian_residuals"
samples = 20000
cg_iters = 100

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
