id = "gaussian-rhs-93x31"

# Gaussian RHS dataset for the 93x31 system: b ~ N(0, 1), x solved from A x = b
#
# Usage: uv run process-data configs/datasets/93x31/gaussian-rhs.toml


[source]
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/93x31-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "gaussian_inverse"
samples = 6000
mu = 0.0
sigma = 1.0

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
