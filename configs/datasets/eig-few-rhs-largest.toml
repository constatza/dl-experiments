# Few-eigenvector RHS dataset (largest eigenvalues, N=5).
# Generates b from eigenvector combinations, then solves x = A^-1 @ b (inverse mode).
# Tests preconditioner performance on RHS vectors aligned with dominant modes.
#
# Usage: uv run python src/neuralls/cli/process_data.py configs/datasets/eig-few-rhs-largest.toml
# Output: eig-few-rhs-largest-{normalization}/

[source]
matrix_path = "${GRAPH_CG_RAW_DIR}/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
normalize = "matrix"
shuffle = true
seed = 42

[[generation.strategy]]
name = "eigenvector_inverse"
which = "largest"
num_eigenvectors = 5
samples = 6000

[output]
data_dir = "${GRAPH_CG_PROCESSED_DIR}"
