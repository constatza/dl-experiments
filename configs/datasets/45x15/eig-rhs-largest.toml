id = "eig-rhs-largest"

# Test config: Eigenvector-based inverse generation (largest eigenvalues)
# Uses eigenvectors as RHS, solves A^-1 @ v for solutions (inverse mode)
# Mirrors the forward eigenvector setup but flips RHS/solution roles
#
# Usage: uv run python src/neuralls/cli/process_data.py configs/datasets/eigenvector-rhs-largest.toml
# Output: eigenvector-rhs-largest-{normalization}/


[source]
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
# Spectral normalization preserves eigenvalue properties
normalize = "matrix"
shuffle = true
seed = 42

# Use largest eigenvectors as RHS, solutions solved via inverse mode
[[generation.strategy]]
name = "eigenvector_inverse"
which = "largest"
num_eigenvectors = 100
samples = 6000

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
