id = "eig-solutions-largest"

# Test config: Eigenvector-based solution generation (largest eigenvalues)
# Uses eigenvectors as solutions, RHS computed as b = λ * v (forward mode)
# Useful for testing CG performance with high-precision eigenvector-based problems
#
# Usage: uv run python src/neuralls/cli/process_data.py configs/datasets/eigenvector-solutions-largest.toml
# Output: eigenvector-solutions-largest-{normalization}/


[source]
matrix_path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/stiffness/subdomain_1_Kaa.txt"

[generation]
# Spectral normalization preserves eigenvalue properties
normalize = "matrix"
shuffle = true
seed = 42

# Use largest eigenvectors as solutions, RHS = eigenvalue * eigenvector
[[generation.strategy]]
name = "eigenvector_forward"
which = "largest"
num_eigenvectors = 100
samples = 6000

[output]
data_dir = "${NEURALLS_PROCESSED_DIR}"
