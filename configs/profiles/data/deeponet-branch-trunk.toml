name = "branch"

[[data.features]]
name = "trunk"
transforms = [
    { name = "Unsqueeze", dim = 1 },
]

[[data.targets]]
name = "y"
transforms = [
    { name = "Unsqueeze", dim = 1 },
]

[data.module]
name = "ArrayDataModule"
