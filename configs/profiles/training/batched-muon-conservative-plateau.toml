[training.trainer]
max_epochs = 300
accelerator = "auto"
enable_checkpointing = true

[[training.trainer.callbacks]]
name = "EarlyStopping"
monitor = "val_loss"
min_delta = 0.0001
patience = 30
mode = "min"
check_finite = true

[training.optimizer.default_optimizer]
name = "Concurrent"
optimizers = [
  { name = "BatchedMuon", lr = 1e-2, momentum = 0.95, nesterov = true, ns_steps = 5 },
  { name = "AdamW", lr = 1e-3, weight_decay = 1e-2 },
]

[training.optimizer.default_scheduler]
name = "ReduceLROnPlateau"
mode = "min"
factor = 0.5
patience = 10
cooldown = 5
threshold = 0.0001
min_lr = 1e-06

[training.loss]
name = "relative_vector_norm_loss"
module_path = "dlkit.domain.losses"
target_key = "targets.y"

[[training.metrics]]
name = "RelativeVectorNormError"
module_path = "dlkit.domain.metrics"
norm_ord = 2
vector_dim = -1
