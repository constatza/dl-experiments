[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-45x15randomE-Factorized-Single-Matrix"
comparison = "Compare-45x15randomE-Factorized-Single-Matrix"

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[datasets]]
id           = "gaussian-cg100-45x15randomE-single-matrix"
path         = "../../datasets/train/45x15randomE/gaussian-cg100-single-matrix.toml"
display_name = "Gaussian CG-100 45x15randomE Single Matrix"

[[datasets]]
id           = "scaled-solutions-45x15randomE-single-matrix"
path         = "../../datasets/test/45x15randomE/scaled-solutions-single-matrix.toml"
display_name = "Scaled Solutions 45x15randomE Single Matrix"

[[datasets]]
id           = "sparse-rhs-45x15randomE-single-matrix"
path         = "../../datasets/test/45x15randomE/sparse-rhs-single-matrix.toml"
display_name = "Sparse RHS 45x15randomE Single Matrix"

[[models]]
id           = "embedded-factorized"
path         = "../../models/ffnn/embedded-factorized-optuna.toml"
display_name = "Scale-Equivariant Embedded Factorized FFNN"

[[models]]
id           = "spectral-factorized"
path         = "../../models/spectral/factorized-optuna.toml"
display_name = "Scale-Equivariant Spectral Factorized FFNN"

[[comparisons]]
id             = "gaussian-cg100-single-matrix"
matrix_dataset = "gaussian-cg100-45x15randomE-single-matrix"
rhs_dataset    = "gaussian-cg100-45x15randomE-single-matrix"
experiments    = [
  "embedded-factorized-gaussian-cg100-45x15randomE-single-matrix",
  "spectral-factorized-gaussian-cg100-45x15randomE-single-matrix",
]

[[comparisons]]
id             = "scaled"
matrix_dataset = "gaussian-cg100-45x15randomE-single-matrix"
rhs_dataset    = "scaled-solutions-45x15randomE-single-matrix"
experiments    = [
  "embedded-factorized-gaussian-cg100-45x15randomE-single-matrix",
  "spectral-factorized-gaussian-cg100-45x15randomE-single-matrix",
]

[[comparisons]]
id             = "sparse"
matrix_dataset = "gaussian-cg100-45x15randomE-single-matrix"
rhs_dataset    = "sparse-rhs-45x15randomE-single-matrix"
experiments    = [
  "embedded-factorized-gaussian-cg100-45x15randomE-single-matrix",
  "spectral-factorized-gaussian-cg100-45x15randomE-single-matrix",
]

[[experiments]]
dataset = "gaussian-cg100-45x15randomE-single-matrix"
model   = "embedded-factorized"

[[experiments]]
dataset = "gaussian-cg100-45x15randomE-single-matrix"
model   = "spectral-factorized"
