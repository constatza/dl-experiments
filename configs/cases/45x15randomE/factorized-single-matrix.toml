[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-45x15randomE-Factorized-Single-Matrix"
comparison = "Compare-45x15randomE-Factorized-Single-Matrix"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg"
type = "amg"
coarsening = { method = "aggregation" }

[[datasets]]
id = "gaussian-cg100-45x15randomE-single-matrix"
path = "../../datasets/train/45x15randomE/gaussian-cg100-single-matrix.toml"
display_name = "Gaussian CG-100 45x15randomE Single Matrix"

[[datasets]]
id = "scaled-solutions-45x15randomE-single-matrix"
path = "../../datasets/test/45x15randomE/scaled-solutions-single-matrix.toml"
display_name = "Scaled Solutions 45x15randomE Single Matrix"

[[datasets]]
id = "sparse-rhs-45x15randomE-single-matrix"
path = "../../datasets/test/45x15randomE/sparse-rhs-single-matrix.toml"
display_name = "Sparse RHS 45x15randomE Single Matrix"

[[jobs]]
id = "constant-width-factorized"
path = "../../jobs/ffnn/constant-width-factorized.toml"
display_name = "Constant-Width Factorized FFNN"

[[jobs]]
id = "constant-width-simple-factorized"
path = "../../jobs/ffnn/constant-width-simple-factorized.toml"
display_name = "Constant-Width Simple Factorized FFNN"

[[jobs]]
id = "scale-equivariant-constant-width-factorized"
path = "../../jobs/ffnn/scale-equivariant-constant-width-factorized.toml"
display_name = "Scale-Equivariant Constant-Width Factorized FFNN"

[[jobs]]
id = "scale-equivariant-constant-width-simple-factorized"
path = "../../jobs/ffnn/scale-equivariant-constant-width-simple-factorized.toml"
display_name = "Scale-Equivariant Constant-Width Simple Factorized FFNN"

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15randomE-single-matrix"
rhs_source = { kind = "gaussian" }
seed = 42
assignments = [
  "constant-width-factorized-gaussian-cg100-45x15randomE-single-matrix",
  "constant-width-simple-factorized-gaussian-cg100-45x15randomE-single-matrix",
  "scale-equivariant-constant-width-factorized-gaussian-cg100-45x15randomE-single-matrix",
  "scale-equivariant-constant-width-simple-factorized-gaussian-cg100-45x15randomE-single-matrix",
]

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15randomE-single-matrix"
rhs_source = { kind = "dataset", path = "${NEURALLS_PROCESSED_DIR}/scaled-solutions-45x15randomE-single-matrix" }
assignments = [
  "constant-width-factorized-gaussian-cg100-45x15randomE-single-matrix",
  "constant-width-simple-factorized-gaussian-cg100-45x15randomE-single-matrix",
  "scale-equivariant-constant-width-factorized-gaussian-cg100-45x15randomE-single-matrix",
  "scale-equivariant-constant-width-simple-factorized-gaussian-cg100-45x15randomE-single-matrix",
]

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15randomE-single-matrix"
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }
assignments = [
  "constant-width-factorized-gaussian-cg100-45x15randomE-single-matrix",
  "constant-width-simple-factorized-gaussian-cg100-45x15randomE-single-matrix",
  "scale-equivariant-constant-width-factorized-gaussian-cg100-45x15randomE-single-matrix",
  "scale-equivariant-constant-width-simple-factorized-gaussian-cg100-45x15randomE-single-matrix",
]

[[assignments]]
dataset = "gaussian-cg100-45x15randomE-single-matrix"
job = "constant-width-factorized"

[[assignments]]
dataset = "gaussian-cg100-45x15randomE-single-matrix"
job = "constant-width-simple-factorized"

[[assignments]]
dataset = "gaussian-cg100-45x15randomE-single-matrix"
job = "scale-equivariant-constant-width-factorized"

[[assignments]]
dataset = "gaussian-cg100-45x15randomE-single-matrix"
job = "scale-equivariant-constant-width-simple-factorized"
