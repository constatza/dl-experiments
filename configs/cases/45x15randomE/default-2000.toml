[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-45x15randomE-Embedded-2000"
comparison = "Compare-45x15randomE-Embedded-2000"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg-small-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.05 }

[[comparison_defaults.preconditioners]]
name = "amg-medium-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.25 }

[[comparison_defaults.preconditioners]]
name = "amg-target-dim"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 175 }

# pod2g-cg1/10/50 are no longer declared here: they are now [[assignments]]
# bound to [[jobs]] pod2g-cg1/10/50 below (a `run.type = "fit"` job per
# dataset), fitted once ahead of time and MLflow-tracked.

[[datasets]]
id = "gaussian-cg1-45x15randomE-2000"
path = "../../datasets/train/45x15randomE/gaussian-cg1-2000.toml"
display_name = "Gaussian (plain, 0 CG iterations) 45x15randomE, 2000 samples (POD-2G snapshot source)"

[[datasets]]
id = "gaussian-cg10-45x15randomE-2000"
path = "../../datasets/train/45x15randomE/gaussian-cg10-2000.toml"
display_name = "Gaussian CG-10 45x15randomE, 2000 samples (POD-2G snapshot source)"

[[datasets]]
id = "gaussian-cg50-45x15randomE-2000"
path = "../../datasets/train/45x15randomE/gaussian-cg50-2000.toml"
display_name = "Gaussian CG-50 45x15randomE, 2000 samples (POD-2G snapshot source)"

[[datasets]]
id = "gaussian-eval-45x15randomE"
path = "../../datasets/test/45x15randomE/gaussian-eval.toml"
display_name = "Gaussian Eval 45x15randomE (matrices excluded from training and POD-2G snapshotting)"

[[jobs]]
id = "pod2g-cg1"
path = "../../jobs/45x15randomE/pod2g-cg1.toml"
display_name = "POD-2G basis (0 CG iterations)"

[[jobs]]
id = "pod2g-cg10"
path = "../../jobs/45x15randomE/pod2g-cg10.toml"
display_name = "POD-2G basis (CG-10)"

[[jobs]]
id = "pod2g-cg50"
path = "../../jobs/45x15randomE/pod2g-cg50.toml"
display_name = "POD-2G basis (CG-50)"

## matrix_index below addresses rows of the gaussian-eval dataset (0..14, one row per
## excluded-from-training matrix — see configs/datasets/test/45x15randomE/gaussian-eval.toml),
## not raw family ids. 0/7/14 = first/middle/last of the 15 excluded matrices.

[[comparisons]]
id = "eval-0-gaussian"
display_name = "Eval matrix 0 | Gaussian RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 0
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
id = "eval-0-sparse"
display_name = "Eval matrix 0 | Sparse RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 0
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
id = "eval-0-raw-lhs"
display_name = "Eval matrix 0 | Raw LHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 0
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[comparisons]]
id = "eval-7-gaussian"
display_name = "Eval matrix 7 | Gaussian RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 7
rhs_source = { kind = "gaussian" }
seed = 43

[[comparisons]]
id = "eval-7-sparse"
display_name = "Eval matrix 7 | Sparse RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 7
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
id = "eval-7-raw-lhs"
display_name = "Eval matrix 7 | Raw LHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 7
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[comparisons]]
id = "eval-14-gaussian"
display_name = "Eval matrix 14 | Gaussian RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 14
rhs_source = { kind = "gaussian" }
seed = 44

[[comparisons]]
id = "eval-14-sparse"
display_name = "Eval matrix 14 | Sparse RHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 14
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
id = "eval-14-raw-lhs"
display_name = "Eval matrix 14 | Raw LHS"
matrix_dataset = "gaussian-eval-45x15randomE"
matrix_index = 14
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[assignments]]
dataset = "gaussian-cg1-45x15randomE-2000"
job = "pod2g-cg1"

[[assignments]]
dataset = "gaussian-cg10-45x15randomE-2000"
job = "pod2g-cg10"

[[assignments]]
dataset = "gaussian-cg50-45x15randomE-2000"
job = "pod2g-cg50"
