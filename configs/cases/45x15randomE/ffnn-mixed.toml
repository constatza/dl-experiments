[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-45x15randomE-FFNN-Mixed"
comparison = "Compare-45x15randomE-FFNN-Mixed"

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ── Training datasets (all CG-iter variants) ──────────────────────────────────

[[datasets]]
id           = "gaussian-cg1-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg1.toml"
display_name = "Gaussian CG-1 45x15randomE"

[[datasets]]
id           = "gaussian-cg10-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg10.toml"
display_name = "Gaussian CG-10 45x15randomE"

[[datasets]]
id           = "gaussian-cg50-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg50.toml"
display_name = "Gaussian CG-50 45x15randomE"

[[datasets]]
id           = "gaussian-cg100-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg100.toml"
display_name = "Gaussian CG-100 45x15randomE"

# ── Test / compare datasets ───────────────────────────────────────────────────

[[datasets]]
id           = "scaled-solutions-45x15"
path         = "../../datasets/test/45x15/scaled-solutions.toml"
display_name = "Scaled Solutions 45x15"

# ── Models ────────────────────────────────────────────────────────────────────

[[models]]
id           = "ffnn-standard"
path         = "../../models/ffnn/standard.toml"
display_name = "FFNN Standard"

# ── Comparisons ───────────────────────────────────────────────────────────────

[[comparisons]]
id             = "gaussian"
matrix_dataset = "gaussian-cg1-45x15randomE"
rhs_dataset    = "gaussian-cg1-45x15randomE"

[[comparisons]]
id             = "scaled"
matrix_dataset = "scaled-solutions-45x15"
rhs_dataset    = "scaled-solutions-45x15"

# ── Experiments (ffnn-standard × 4 training datasets) ────────────────────────

[[experiments]]
dataset      = "gaussian-cg1-45x15randomE"
model        = "ffnn-standard"

[[experiments]]
dataset      = "gaussian-cg10-45x15randomE"
model        = "ffnn-standard"

[[experiments]]
dataset      = "gaussian-cg50-45x15randomE"
model        = "ffnn-standard"

[[experiments]]
dataset      = "gaussian-cg100-45x15randomE"
model        = "ffnn-standard"
