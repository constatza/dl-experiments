[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-45x15randomE-Conditional"
comparison = "Compare-45x15randomE-Conditional"

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg"
type = "amg"
coarsening = { method = "aggregation" }

# ── Training datasets ─────────────────────────────────────────────────────────

[[datasets]]
id           = "gaussian-cg10-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg10.toml"
display_name = "Gaussian CG-10 45x15randomE"

[[datasets]]
id           = "gaussian-cg100-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg100.toml"
display_name = "Gaussian CG-100 45x15randomE"

# ── Models (scale-equivariant FiLM variants — condition on E parameters) ──────
# These models condition on E via feature-wise linear modulation (FiLM)
# and apply scale-equivariant feature embeddings.

[[jobs]]
id           = "film-ffnn"
path         = "../../jobs/film/film-ffnn.toml"
display_name = "Scale-Equivariant FiLM FFNN"

[[jobs]]
id           = "film-ffnn-embedded"
path         = "../../jobs/film/film-ffnn-embedded.toml"
display_name = "Scale-Equivariant FiLM Embedded FFNN"

# ── Comparisons ───────────────────────────────────────────────────────────────

[[comparisons]]
matrix_dataset = "gaussian-cg10-45x15randomE"
rhs_source = { kind = "gaussian" }
seed           = 42
assignments    = [
  "film-ffnn-gaussian-cg10-45x15randomE",
  "film-ffnn-embedded-gaussian-cg10-45x15randomE",
]

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15randomE"
rhs_source = { kind = "gaussian" }
seed           = 42
assignments    = [
  "film-ffnn-gaussian-cg100-45x15randomE",
  "film-ffnn-embedded-gaussian-cg100-45x15randomE",
]

# ── Assignments (2 models × 2 datasets) ──────────────────────────────────────

[[assignments]]
dataset = "gaussian-cg10-45x15randomE"
job = "film-ffnn"

[[assignments]]
dataset = "gaussian-cg10-45x15randomE"
job = "film-ffnn-embedded"

[[assignments]]
dataset = "gaussian-cg100-45x15randomE"
job = "film-ffnn"

[[assignments]]
dataset = "gaussian-cg100-45x15randomE"
job = "film-ffnn-embedded"
