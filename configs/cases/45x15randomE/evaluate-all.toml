[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-45x15randomE-All"
comparison = "Compare-45x15randomE-All"

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ── Training datasets (max CG-iter only) ─────────────────────────────────────

[[datasets]]
id           = "gaussian-cg1-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg1.toml"
display_name = "Gaussian CG-1 45x15randomE"

[[datasets]]
id           = "gaussian-cg100-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg100.toml"
display_name = "Gaussian CG-100 45x15randomE"

# ── Test / compare datasets ───────────────────────────────────────────────────

[[datasets]]
id           = "scaled-solutions-45x15"
path         = "../../datasets/test/45x15/scaled-solutions.toml"
display_name = "Scaled Solutions 45x15"

# ── Models ────────────────────────────────────────────────────────────────────

[[models]]
id           = "ffnn-standard"
path         = "../../models/ffnn/ffnn.toml"
display_name = "FFNN Standard"

[[models]]
id           = "embedded-factorized"
path         = "../../models/ffnn/embedded-factorized.toml"
display_name = "Embedded Factorized"

[[models]]
id           = "symmetric-embedded-spd"
path         = "../../models/symmetric/embedded-spd.toml"
display_name = "Symmetric Embedded SPD"

[[models]]
id           = "symmetric-embedded-spd-factorized"
path         = "../../models/symmetric/embedded-spd-factorized.toml"
display_name = "Symmetric Embedded SPD-Factorized"

[[models]]
id           = "symmetric-spd"
path         = "../../models/symmetric/spd.toml"
display_name = "Symmetric SPD"

[[models]]
id           = "symmetric-spd-factorized"
path         = "../../models/symmetric/spd-factorized.toml"
display_name = "Symmetric SPD-Factorized"

[[models]]
id           = "spectral-siren"
path         = "../../models/spectral/siren.toml"
display_name = "Spectral SIREN"

[[models]]
id           = "spectral-fourier"
path         = "../../models/spectral/fourier-feature-network.toml"
display_name = "Spectral Fourier"

[[models]]
id           = "spectral-modified-mlp"
path         = "../../models/spectral/modified-mlp.toml"
display_name = "Spectral Modified MLP"

[[models]]
id           = "spectral-factorized"
path         = "../../models/spectral/factorized.toml"
display_name = "Spectral Factorized"

# ── Comparisons ───────────────────────────────────────────────────────────────

[[comparisons]]
id             = "gaussian"
matrix_dataset = "gaussian-cg1-45x15randomE"
rhs_dataset    = "gaussian-cg1-45x15randomE"

[[comparisons]]
id             = "scaled"
matrix_dataset = "scaled-solutions-45x15"
rhs_dataset    = "scaled-solutions-45x15"

# ── Experiments (10 models × 1 training dataset = 10) ────────────────────────

[[experiments]]
dataset      = "gaussian-cg100-45x15randomE"
model        = "ffnn-standard"

[[experiments]]
dataset      = "gaussian-cg100-45x15randomE"
model        = "embedded-factorized"

[[experiments]]
dataset      = "gaussian-cg100-45x15randomE"
model        = "symmetric-embedded-spd"

[[experiments]]
dataset      = "gaussian-cg100-45x15randomE"
model        = "symmetric-embedded-spd-factorized"

[[experiments]]
dataset      = "gaussian-cg100-45x15randomE"
model        = "symmetric-spd"

[[experiments]]
dataset      = "gaussian-cg100-45x15randomE"
model        = "symmetric-spd-factorized"

[[experiments]]
dataset      = "gaussian-cg100-45x15randomE"
model        = "spectral-siren"

[[experiments]]
dataset      = "gaussian-cg100-45x15randomE"
model        = "spectral-fourier"

[[experiments]]
dataset      = "gaussian-cg100-45x15randomE"
model        = "spectral-modified-mlp"

[[experiments]]
dataset      = "gaussian-cg100-45x15randomE"
model        = "spectral-factorized"
