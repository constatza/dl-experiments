[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-45x15randomE-Factorized"
comparison = "Compare-45x15randomE-Factorized"

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ── Training datasets ─────────────────────────────────────────────────────────

[[datasets]]
id           = "gaussian-cg10-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg10.toml"
display_name = "Gaussian CG-10 45x15randomE"

[[datasets]]
id           = "gaussian-cg100-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg100.toml"
display_name = "Gaussian CG-100 45x15randomE"

[[datasets]]
id           = "scaled-solutions-45x15randomE"
path         = "../../datasets/test/45x15randomE/scaled-solutions.toml"
display_name = "Scaled Solutions 45x15randomE"

[[datasets]]
id           = "sparse-rhs-45x15randomE"
path         = "../../datasets/test/45x15randomE/sparse-rhs.toml"
display_name = "Sparse RHS 45x15randomE"

# ── Models (regular factorized variants, including embedded) ──────────────────

[[jobs]]
id           = "embedded-factorized"
path         = "../../jobs/ffnn/embedded-factorized-optuna.toml"
display_name = "Scale-Equivariant Embedded Factorized FFNN"

# ── Comparisons (one per training dataset, filtered to own experiments) ───────

[[comparisons]]
id             = "gaussian-cg10"
matrix_dataset = "gaussian-cg10-45x15randomE"
rhs_generation = { kind = "gaussian" }
seed           = 42
experiments    = [
  "embedded-factorized-gaussian-cg10-45x15randomE",
]

[[comparisons]]
id             = "gaussian-cg100"
matrix_dataset = "gaussian-cg100-45x15randomE"
rhs_generation = { kind = "gaussian" }
seed           = 42
experiments    = [
  "embedded-factorized-gaussian-cg100-45x15randomE",
]

[[comparisons]]
id             = "scaled"
matrix_dataset = "gaussian-cg100-45x15randomE"
rhs_dataset    = "scaled-solutions-45x15randomE"
experiments    = [
  "embedded-factorized-gaussian-cg100-45x15randomE",
]

[[comparisons]]
id             = "sparse"
matrix_dataset = "gaussian-cg100-45x15randomE"
rhs_generation = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }
experiments    = [
  "embedded-factorized-gaussian-cg100-45x15randomE",
]

# ── Experiments (2 models × 2 datasets) ──────────────────────────────────────

[[experiments]]
dataset = "gaussian-cg10-45x15randomE"
job = "embedded-factorized"

[[experiments]]
dataset = "gaussian-cg100-45x15randomE"
job = "embedded-factorized"
