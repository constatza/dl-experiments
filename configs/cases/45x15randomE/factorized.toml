[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-45x15randomE-Embedded"
comparison = "Compare-45x15randomE-Embedded"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg"
type = "amg"
coarsening = { method = "aggregation", theta = 0.05 }

[[comparison_defaults.preconditioners]]
name = "pod2g-cg1"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/solutions-cg1-45x15randomE", n_snapshots = -1, rank = 0.9999 }

[[comparison_defaults.preconditioners]]
name = "pod2g-cg10"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/solutions-cg10-45x15randomE", n_snapshots = -1, rank = 0.9999 }

[[comparison_defaults.preconditioners]]
name = "pod2g-cg50"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/solutions-cg50-45x15randomE", n_snapshots = -1, rank = 0.9999 }

[[datasets]]
id = "gaussian-cg100-45x15randomE"
path = "../../datasets/train/45x15randomE/gaussian-cg100.toml"
display_name = "Gaussian CG-100 45x15randomE"

[[datasets]]
id = "solutions-cg1-45x15randomE"
path = "../../datasets/train/45x15randomE/solutions-cg1.toml"
display_name = "Solutions (plain, 0 CG iterations) 45x15randomE (POD-2G snapshot source)"

[[datasets]]
id = "solutions-cg10-45x15randomE"
path = "../../datasets/train/45x15randomE/solutions-cg10.toml"
display_name = "Solutions CG-10 45x15randomE (POD-2G snapshot source)"

[[datasets]]
id = "solutions-cg50-45x15randomE"
path = "../../datasets/train/45x15randomE/solutions-cg50.toml"
display_name = "Solutions CG-50 45x15randomE (POD-2G snapshot source)"

[[datasets]]
id = "scaled-solutions-45x15randomE"
path = "../../datasets/test/45x15randomE/scaled-solutions.toml"
display_name = "Scaled Solutions 45x15randomE"

[[datasets]]
id = "sparse-rhs-45x15randomE"
path = "../../datasets/test/45x15randomE/sparse-rhs.toml"
display_name = "Sparse RHS 45x15randomE"

[[jobs]]
id = "scale-equivariant-embedded-factorized"
path = "../../jobs/45x15randomE/scale-equivariant-embedded-factorized.toml"
display_name = "Embedded DeepONet (branch=RHS, trunk=Young moduli)"

[[jobs]]
id = "scale-equivariant-embedded-hyper"
path = "../../jobs/45x15randomE/scale-equivariant-embedded-hyper.toml"
display_name = "Hyper DeepONet (branch=RHS, trunk=Young moduli)"

[[jobs]]
id = "scale-equivariant-embedded-moe"
path = "../../jobs/45x15randomE/scale-equivariant-embedded-moe.toml"
display_name = "MoE DeepONet (branch=RHS, trunk=Young moduli)"

[[comparisons]]
id = "matrix-0-gaussian"
display_name = "Matrix 0 | Gaussian RHS"
matrix_dataset = "gaussian-cg100-45x15randomE"
matrix_index = 0
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
id = "matrix-0-sparse"
display_name = "Matrix 0 | Sparse RHS"
matrix_dataset = "gaussian-cg100-45x15randomE"
matrix_index = 0
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
id = "matrix-0-raw-lhs"
display_name = "Matrix 0 | Raw LHS"
matrix_dataset = "gaussian-cg100-45x15randomE"
matrix_index = 0
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[comparisons]]
id = "matrix-1-gaussian"
