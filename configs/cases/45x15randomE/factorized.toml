[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-45x15randomE-Factorized"
comparison = "Compare-45x15randomE-Factorized"

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg"
type = "amg"
coarsening = { method = "aggregation" }

# neural-pod2g: snapshots are predicted from gaussian-cg10-45x15randomE's
# Young's-modulus `params` array via a checkpoint, instead of read from a
# precomputed solutions array (compare to the dataset-backed "pod2g" pattern
# in configs/cases/45x15/cg.toml). `input_names` must match the checkpoint's
# own trained forward()/predict() keyword argument name(s) exactly - these
# are declared training-side in the DLKit job config, NOT derived from the
# dataset's on-disk params artifact naming, so the placeholder "young_modulus"
# below must be replaced with whatever a real training job actually declares.
# No job in this repo is yet trained to map params -> full-order solutions,
# so checkpoint_path below is a placeholder too — replace it with a real
# checkpoint (or an `assignment =` reference) before using this entry.
[[comparison_defaults.preconditioners]]
name = "neural-pod2g"
type = "amg"
coarsening = { method = "neural_pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-cg10-45x15randomE", checkpoint_path = "${NEURALLS_OUTPUT_DIR}/PLACEHOLDER-params-to-solution.ckpt", input_names = ["young_modulus"], rank = 0.9999 }

# ── Training datasets ─────────────────────────────────────────────────────────

[[datasets]]
id           = "gaussian-cg10-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg10.toml"
display_name = "Gaussian CG-10 45x15randomE"

[[datasets]]
id           = "gaussian-cg100-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg100.toml"
display_name = "Gaussian CG-100 45x15randomE"

[[datasets]]
id           = "scaled-solutions-45x15randomE"
path         = "../../datasets/test/45x15randomE/scaled-solutions.toml"
display_name = "Scaled Solutions 45x15randomE"

[[datasets]]
id           = "sparse-rhs-45x15randomE"
path         = "../../datasets/test/45x15randomE/sparse-rhs.toml"
display_name = "Sparse RHS 45x15randomE"

# ── Models (FullyEmbedded factorized variants) ────────────────────────────────

[[jobs]]
id           = "scale-equivariant-embedded-factorized"
path         = "../../jobs/ffnn/scale-equivariant-embedded-factorized.toml"
display_name = "Scale-Equivariant Embedded Factorized FFNN"

# ── Comparisons (one per training dataset, filtered to own assignments) ───────

[[comparisons]]
matrix_dataset = "gaussian-cg10-45x15randomE"
rhs_source = { kind = "gaussian" }
seed           = 42
assignments    = [
  "scale-equivariant-embedded-factorized-gaussian-cg10-45x15randomE",
]

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15randomE"
rhs_source = { kind = "gaussian" }
seed           = 42
assignments    = [
  "scale-equivariant-embedded-factorized-gaussian-cg100-45x15randomE",
]

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15randomE"
rhs_source = { kind = "dataset", path = "${NEURALLS_PROCESSED_DIR}/scaled-solutions-45x15randomE" }
assignments    = [
  "scale-equivariant-embedded-factorized-gaussian-cg100-45x15randomE",
]

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15randomE"
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }
assignments    = [
  "scale-equivariant-embedded-factorized-gaussian-cg100-45x15randomE",
]

# ── Assignments (2 models × 2 datasets) ──────────────────────────────────────

[[assignments]]
dataset = "gaussian-cg10-45x15randomE"
job = "scale-equivariant-embedded-factorized"

[[assignments]]
dataset = "gaussian-cg100-45x15randomE"
job = "scale-equivariant-embedded-factorized"
