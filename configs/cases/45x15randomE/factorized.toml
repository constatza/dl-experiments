[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-45x15randomE-Factorized"
comparison = "Compare-45x15randomE-Factorized"

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ── Training datasets ─────────────────────────────────────────────────────────

[[datasets]]
id           = "gaussian-cg10-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg10.toml"
display_name = "Gaussian CG-10 45x15randomE"

[[datasets]]
id           = "gaussian-cg100-45x15randomE"
path         = "../../datasets/train/45x15randomE/gaussian-cg100.toml"
display_name = "Gaussian CG-100 45x15randomE"

[[datasets]]
id           = "scaled-solutions-45x15randomE"
path         = "../../datasets/test/45x15randomE/scaled-solutions.toml"
display_name = "Scaled Solutions 45x15randomE"

[[datasets]]
id           = "sparse-rhs-45x15randomE"
path         = "../../datasets/test/45x15randomE/sparse-rhs.toml"
display_name = "Sparse RHS 45x15randomE"

# ── Models (FullyEmbedded factorized variants) ────────────────────────────────

[[jobs]]
id           = "scale-equivariant-embedded-fully-factorized"
path         = "../../jobs/ffnn/scale-equivariant-embedded-fully-factorized.toml"
display_name = "Scale-Equivariant Embedded Fully Factorized FFNN"

# ── Comparisons (one per training dataset, filtered to own assignments) ───────

[[comparisons]]
matrix_dataset = "gaussian-cg10-45x15randomE"
rhs_source = { kind = "gaussian" }
seed           = 42
assignments    = [
  "scale-equivariant-embedded-fully-factorized-gaussian-cg10-45x15randomE",
]

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15randomE"
rhs_source = { kind = "gaussian" }
seed           = 42
assignments    = [
  "scale-equivariant-embedded-fully-factorized-gaussian-cg100-45x15randomE",
]

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15randomE"
rhs_source = { kind = "dataset", path = "${NEURALLS_PROCESSED_DIR}/scaled-solutions-45x15randomE" }
assignments    = [
  "scale-equivariant-embedded-fully-factorized-gaussian-cg100-45x15randomE",
]

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15randomE"
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }
assignments    = [
  "scale-equivariant-embedded-fully-factorized-gaussian-cg100-45x15randomE",
]

# ── Assignments (2 models × 2 datasets) ──────────────────────────────────────

[[assignments]]
dataset = "gaussian-cg10-45x15randomE"
job = "scale-equivariant-embedded-fully-factorized"

[[assignments]]
dataset = "gaussian-cg100-45x15randomE"
job = "scale-equivariant-embedded-fully-factorized"
