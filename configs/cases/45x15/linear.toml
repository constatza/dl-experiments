# Residual linear registry for archive-backed and Gaussian residual sweeps.

[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-45x15"
comparison = "Compare-45x15"

# ────────────────────────
# Comparison defaults
# ────────────────────────

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ───────────────────────
# Datasets
# ───────────────────────

[[datasets]]
id   = "residuals-100"
path = "../../datasets/45x15/residuals-100.toml"
display_name = "Residual-Error 100"

[[datasets]]
id   = "res-gaussian-100"
path = "../../datasets/45x15/res-gaussian-100.toml"
display_name = "Residual-Error 100 Gaussian"

[[datasets]]
id   = "res-gaussian-0"
path = "../../datasets/45x15/res-gaussian-0.toml"
display_name = "Residual-Error 0 Gaussian"

[[datasets]]
id   = "res-gaussian-10"
path = "../../datasets/45x15/res-gaussian-10.toml"
display_name = "Residual-Error 10 Gaussian"

[[datasets]]
id   = "res-gaussian-20"
path = "../../datasets/45x15/res-gaussian-20.toml"
display_name = "Residual-Error 20 Gaussian"

[[datasets]]
id   = "res-gaussian-50"
path = "../../datasets/45x15/res-gaussian-50.toml"
display_name = "Residual-Error 50 Gaussian"

[[datasets]]
id   = "res-gaussian-100-93x31"
path = "../../datasets/93x31/res-gaussian-100.toml"
display_name = "Residual-Error 100 Gaussian 93x31"

[[datasets]]
id   = "solutions"
path = "../../datasets/45x15/solutions.toml"
display_name = "Solutions"

[[datasets]]
id   = "gaussian-rhs"
path = "../../datasets/45x15/gaussian-rhs.toml"
display_name = "Gaussian RHS"

[[datasets]]
id   = "scaled-solutions"
path = "../../datasets/45x15/scaled-solutions.toml"
display_name = "Scaled Solutions"

[[datasets]]
id   = "sparse-rhs"
path = "../../datasets/45x15/sparse-rhs.toml"
display_name = "Sparse RHS"

# ───────────────────────
# Models
# ───────────────────────

[[models]]
id   = "linear"
path = "../../models/linear/linear.toml"
display_name = "Linear"

# ───────────────────────────────────────────────────────────────────────────
# Comparisons  (data binding — methodology from [comparison_defaults] above)
# ───────────────────────────────────────────────────────────────────────────

[[comparisons]]
id             = "gaussian"
matrix_dataset = "solutions"
rhs_dataset    = "gaussian-rhs"
display_name   = "Gaussian RHS"

[[comparisons]]
id             = "scaled-solutions"
matrix_dataset = "solutions"
rhs_dataset    = "scaled-solutions"
display_name   = "Scaled Spectral Comparison"

[[comparisons]]
id             = "sparse-rhs"
matrix_dataset = "solutions"
rhs_dataset    = "sparse-rhs"
display_name   = "Sparse RHS Comparison"

# ───────────────────────
# Experiments
# ───────────────────────

[[experiments]]
id      = "residuals"
dataset = "residuals-100"
model   = "linear"
display_name = "Residual-Error"

[[experiments]]
id      = "res-gaussian-100-linear"
dataset = "res-gaussian-100"
model   = "linear"
display_name = "Residual-Error Gaussian"
