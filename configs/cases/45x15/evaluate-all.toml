[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-45x15"
comparison = "Compare-45x15"

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ── Training datasets (max CG-iter only) ─────────────────────────────────────

[[datasets]]
id           = "gaussian-cg100-45x15"
path         = "../../datasets/train/45x15/gaussian-cg100.toml"
display_name = "Gaussian CG-100 45x15"

[[datasets]]
id           = "solutions-cg100-45x15"
path         = "../../datasets/train/45x15/solutions-cg100.toml"
display_name = "Solutions CG-100 45x15"

# ── Test / compare datasets ───────────────────────────────────────────────────

[[datasets]]
id           = "gaussian-rhs-45x15"
path         = "../../datasets/test/45x15/gaussian-rhs.toml"
display_name = "Gaussian RHS 45x15"

[[datasets]]
id           = "scaled-solutions-45x15"
path         = "../../datasets/test/45x15/scaled-solutions.toml"
display_name = "Scaled Solutions 45x15"

[[datasets]]
id           = "sparse-rhs-45x15"
path         = "../../datasets/test/45x15/sparse-rhs.toml"
display_name = "Sparse RHS 45x15"

# ── Models ────────────────────────────────────────────────────────────────────

[[models]]
id           = "ffnn-standard"
path         = "../../models/ffnn/standard.toml"
display_name = "FFNN Standard"

[[models]]
id           = "embedded-factorized"
path         = "../../models/embedded/embedded-factorized.toml"
display_name = "Embedded Factorized"

[[models]]
id           = "symmetric-embedded-spd"
path         = "../../models/symmetric/embedded-spd.toml"
display_name = "Symmetric Embedded SPD"

[[models]]
id           = "symmetric-embedded-spd-factorized"
path         = "../../models/symmetric/embedded-spd-factorized.toml"
display_name = "Symmetric Embedded SPD-Factorized"

[[models]]
id           = "symmetric-spd"
path         = "../../models/symmetric/spd.toml"
display_name = "Symmetric SPD"

[[models]]
id           = "symmetric-spd-factorized"
path         = "../../models/symmetric/spd-factorized.toml"
display_name = "Symmetric SPD-Factorized"

[[models]]
id           = "spectral-siren"
path         = "../../models/spectral/siren.toml"
display_name = "Spectral SIREN"

[[models]]
id           = "spectral-fourier"
path         = "../../models/spectral/fourier.toml"
display_name = "Spectral Fourier"

[[models]]
id           = "spectral-modified-mlp"
path         = "../../models/spectral/modified-mlp.toml"
display_name = "Spectral Modified MLP"

[[models]]
id           = "spectral-factorized"
path         = "../../models/spectral/factorized.toml"
display_name = "Spectral Factorized"

# ── Comparisons ───────────────────────────────────────────────────────────────

[[comparisons]]
id             = "gaussian"
matrix_dataset = "gaussian-rhs-45x15"
rhs_dataset    = "gaussian-rhs-45x15"
display_name   = "Gaussian RHS"

[[comparisons]]
id             = "scaled"
matrix_dataset = "scaled-solutions-45x15"
rhs_dataset    = "scaled-solutions-45x15"
display_name   = "Scaled Solutions"

[[comparisons]]
id             = "sparse"
matrix_dataset = "sparse-rhs-45x15"
rhs_dataset    = "sparse-rhs-45x15"
display_name   = "Sparse RHS"

# ── Experiments (10 models × 2 training datasets = 20) ───────────────────────

[[experiments]]
id           = "gaussian-cg100-45x15-ffnn-standard"
dataset      = "gaussian-cg100-45x15"
model        = "ffnn-standard"
display_name = "Gaussian CG-100 45x15 | FFNN Standard"

