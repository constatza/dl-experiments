model        = "ffnn-standard"
display_name = "Gaussian CG-10 45x15 | FFNN Standard"

[[experiments]]
id           = "gaussian-cg50-45x15-ffnn-standard"
dataset      = "gaussian-cg50-45x15"
model        = "ffnn-standard"
display_name = "Gaussian CG-50 45x15 | FFNN Standard"

[[experiments]]
id           = "gaussian-cg100-45x15-ffnn-standard"
