# Scale-equivariant FFNN registry for the 93x31 Gaussian residual sweep.

[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-45x15"
comparison = "Compare-45x15"

# ────────────────────────
# Comparison defaults
# ────────────────────────

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ───────────────────────
# Datasets
# ───────────────────────

[[datasets]]
id   = "res-gaussian-50-93x31"
path = "../../datasets/93x31/res-gaussian-50.toml"
display_name = "Residual-Error 50 Gaussian 93x31"

[[datasets]]
id   = "solutions"
path = "../../datasets/45x15/solutions.toml"
display_name = "Solutions"

[[datasets]]
id   = "gaussian-rhs"
path = "../../datasets/45x15/gaussian-rhs.toml"
display_name = "Gaussian RHS"

[[datasets]]
id   = "scaled-solutions"
path = "../../datasets/45x15/scaled-solutions.toml"
display_name = "Scaled Solutions"

[[datasets]]
id   = "sparse-rhs"
path = "../../datasets/45x15/sparse-rhs.toml"
display_name = "Sparse RHS"

# ───────────────────────
# Models
# ───────────────────────

[[models]]
id   = "scale-equivariant-constant-width-3000"
path = "../../models/scale-equivariant/constant-width-3000.toml"
display_name = "Scale-Equivariant Constant-Width 3000"

[[models]]
id   = "embedded-factorized"
path = "../../models/scale-equivariant/embedded-factorized.toml"
display_name = "Scale-Equivariant Embedded Factorized"

[[models]]
id   = "embedded-spd"
path = "../../models/scale-equivariant/embedded-spd.toml"
display_name = "Scale-Equivariant Embedded SPD"

[[models]]
id   = "embedded-spd-factorized"
path = "../../models/scale-equivariant/embedded-spd-factorized.toml"
display_name = "Scale-Equivariant Embedded SPD-Factorized"

# ───────────────────────────────────────────────────────────────────────────
# Comparisons  (data binding — methodology from [comparison_defaults] above)
# ───────────────────────────────────────────────────────────────────────────

[[comparisons]]
id             = "gaussian"
matrix_dataset = "solutions"
rhs_dataset    = "gaussian-rhs"
display_name   = "Gaussian RHS"

# ───────────────────────
# Experiments
# ───────────────────────

[[experiments]]
id      = "res-gaussian-50-93x31-scale-equivariant-constant-width-3000"
dataset = "res-gaussian-50-93x31"
model   = "scale-equivariant-constant-width-3000"
display_name = "Residual-Error 50 Gaussian 93x31 | Scale-Equivariant Constant-Width 3000"

[[experiments]]
id      = "res-gaussian-50-93x31-embedded-factorized"
dataset = "res-gaussian-50-93x31"
model   = "embedded-factorized"
display_name = "Residual-Error 50 Gaussian 93x31 | Scale-Equivariant Embedded Factorized"

[[experiments]]
id      = "res-gaussian-50-93x31-embedded-spd"
dataset = "res-gaussian-50-93x31"
model   = "embedded-spd"
display_name = "Residual-Error 50 Gaussian 93x31 | Scale-Equivariant Embedded SPD"

[[experiments]]
id      = "res-gaussian-50-93x31-embedded-spd-factorized"
dataset = "res-gaussian-50-93x31"
model   = "embedded-spd-factorized"
display_name = "Residual-Error 50 Gaussian 93x31 | Scale-Equivariant Embedded SPD-Factorized"
