# Scale-equivariant constant-width FFNN registry for Gaussian and archive residual sweeps.

[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-45x15"
comparison = "Compare-45x15"

# ────────────────────────
# Comparison defaults
# ────────────────────────

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ───────────────────────────────────────────────────────────────────────────
# Datasets
#   Training datasets: res-gaussian-{1,2,5,10,100}
#   Comparison datasets: solutions (test matrix) + comparison RHS variants
# ───────────────────────────────────────────────────────────────────────────

# [[datasets]]
# id   = "res-gaussian-1"
# path = "../../datasets/45x15/res-gaussian-1.toml"
# display_name = "Residual-Error 1 Gaussian"

# [[datasets]]
