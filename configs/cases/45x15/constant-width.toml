# display_name = "Residual-Error 10 Gaussian"

[[datasets]]
id   = "res-gaussian-50"
path = "../../datasets/45x15/res-gaussian-50.toml"
display_name = "Residual-Error 50 Gaussian"

[[datasets]]
id   = "residuals-50"
path = "../../datasets/45x15/residuals-50.toml"
display_name = "Residual-Error 50 Archive"

[[datasets]]
id   = "solutions"
path = "../../datasets/45x15/solutions.toml"
display_name = "Solutions"

[[datasets]]
id   = "gaussian-rhs"
path = "../../datasets/45x15/gaussian-rhs.toml"
display_name = "Gaussian RHS"

[[datasets]]
id   = "scaled-solutions"
path = "../../datasets/45x15/scaled-solutions.toml"
display_name = "Scaled Solutions"

[[datasets]]
id   = "sparse-rhs"
path = "../../datasets/45x15/sparse-rhs.toml"
display_name = "Sparse RHS"

# ───────────────────────
# Models
# ───────────────────────

[[models]]
id   = "scale-equivariant-constant-width"
path = "../../models/scale-equivariant/constant-width.toml"
display_name = "Scale-Equivariant Constant-Width"

# ───────────────────────────────────────────────────────────────────────────
# Comparisons  (data binding — methodology from [comparison_defaults] above)
# ───────────────────────────────────────────────────────────────────────────

[[comparisons]]
id             = "gaussian"
matrix_dataset = "solutions"
rhs_dataset    = "gaussian-rhs"
display_name   = "Gaussian RHS"

[[comparisons]]
id             = "scaled-solutions"
matrix_dataset = "solutions"
rhs_dataset    = "scaled-solutions"
display_name   = "Scaled Solutions"

[[comparisons]]
id             = "sparse-rhs"
matrix_dataset = "solutions"
rhs_dataset    = "sparse-rhs"
display_name   = "Sparse RHS"

# ───────────────────────
# Experiments
# ───────────────────────

[[experiments]]
id      = "res-gaussian-50-scale-equivariant-constant-width"
dataset = "res-gaussian-50"
model   = "scale-equivariant-constant-width"
display_name = "Residual-Error 50 Gaussian | Scale-Equivariant Constant-Width"

[[experiments]]
id      = "residuals-50-scale-equivariant-constant-width"
dataset = "residuals-50"
model   = "scale-equivariant-constant-width"
display_name = "Residual-Error 50 Archive | Scale-Equivariant Constant-Width"
