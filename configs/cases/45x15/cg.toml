[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-45x15-Scale-Equivariant-CG"
comparison = "Compare-45x15-Scale-Equivariant-CG"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[datasets]]
id = "gaussian-cg100-45x15"
path = "../../datasets/train/45x15/gaussian-cg100.toml"
display_name = "Gaussian CG-100 45x15"

[[jobs]]
id = "scale-equivariant-embedded-fully-factorized"
path = "../../jobs/scale-equivariant-200/embedded-fully-factorized.toml"
display_name = "Scale-Equivariant Embedded Fully Factorized FFNN"

[[jobs]]
id = "constant-width-factorized"
path = "../../jobs/ffnn/constant-width-factorized.toml"
display_name = "Constant-Width Factorized FFNN"

[[jobs]]
id = "scale-equivariant-constant-width-factorized"
path = "../../jobs/scale-equivariant-200/constant-width-factorized.toml"
display_name = "Scale-Equivariant Constant-Width Factorized FFNN"

[[comparisons]]
id = "gaussian-cg100"
matrix_dataset = "gaussian-cg100-45x15"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
id = "sparse-cg100"
matrix_dataset = "gaussian-cg100-45x15"
rhs_source = { kind = "sparse", indices = [
    0,
    1,
    -1,
], values = [
    90.0,
    100.0,
    -100.0,
] }

[[comparisons]]
id = "scaled-cg100"
matrix_dataset = "gaussian-cg100-45x15"
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[experiments]]
dataset = "gaussian-cg100-45x15"
job = "scale-equivariant-embedded-fully-factorized"

[[experiments]]
dataset = "gaussian-cg100-45x15"
job = "constant-width-factorized"

[[experiments]]
dataset = "gaussian-cg100-45x15"
job = "scale-equivariant-constant-width-factorized"
