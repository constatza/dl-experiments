[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-45x15-Scale-Equivariant-CG"
comparison = "Compare-45x15-Scale-Equivariant-CG"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg"
type = "amg"
coarsening = { method = "aggregation" }

[[comparison_defaults.preconditioners]]
name = "pod2g"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/solutions-cg10-45x15", n_snapshots = -1, rank = 0.9999 }

[[datasets]]
id = "gaussian-cg100-45x15"
path = "../../datasets/train/45x15/gaussian-cg100.toml"
display_name = "Gaussian CG-100 45x15"

[[datasets]]
id = "solutions-cg10-45x15"
path = "../../datasets/train/45x15/solutions-cg10.toml"
display_name = "Solutions CG-10 45x15 (POD-2G snapshot source)"

[[jobs]]
id = "scale-equivariant-constant-width-factorized"
path = "../../jobs/45x15/scale-equivariant-constant-width-factorized.toml"
display_name = "Scale Equivariant Constant Width FFNN"

[[jobs]]
id = "scale-equivariant-constant-width-softplus-factorized"
path = "../../jobs/45x15/scale-equivariant-constant-width-softplus-factorized.toml"
display_name = "Scale Equivariant Constant Width Softplus FFNN"

[[jobs]]
id = "scale-equivariant-embedded-fully-factorized"
path = "../../jobs/45x15/scale-equivariant-embedded-fully-factorized.toml"
display_name = "Scale Equivariant Embedded Fully FFNN"

[[jobs]]
id = "scale-equivariant-embedded-fully-softplus-factorized"
path = "../../jobs/45x15/scale-equivariant-embedded-fully-softplus-factorized.toml"
display_name = "Scale Equivariant Embedded Fully Softplus FFNN"

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15"
rhs_source = { kind = "sparse", indices = [
    0,
    1,
    -1,
], values = [
    90.0,
    100.0,
    -100.0,
] }

[[comparisons]]
matrix_dataset = "gaussian-cg100-45x15"
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/45x15-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[assignments]]
dataset = "gaussian-cg100-45x15"
job = "scale-equivariant-constant-width-factorized"

[[assignments]]
dataset = "gaussian-cg100-45x15"
job = "scale-equivariant-constant-width-softplus-factorized"

[[assignments]]
dataset = "gaussian-cg100-45x15"
job = "scale-equivariant-embedded-fully-factorized"

[[assignments]]
dataset = "gaussian-cg100-45x15"
job = "scale-equivariant-embedded-fully-softplus-factorized"
