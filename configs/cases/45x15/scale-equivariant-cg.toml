[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-45x15-Scale-Equivariant-CG"
comparison = "Compare-45x15-Scale-Equivariant-CG"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[datasets]]
id = "gaussian-cg10-45x15"
path = "../../datasets/train/45x15/gaussian-cg10.toml"
display_name = "Gaussian CG-10 45x15"

[[datasets]]
id = "gaussian-cg100-45x15"
path = "../../datasets/train/45x15/gaussian-cg100.toml"
display_name = "Gaussian CG-100 45x15"

[[datasets]]
id = "scaled-solutions-45x15"
path = "../../datasets/test/45x15/scaled-solutions.toml"
display_name = "Scaled Solutions 45x15"

[[jobs]]
id = "ffnn"
path = "../../jobs/scale-equivariant-200/ffnn.toml"
display_name = "Scale-Equivariant FFNN"

[[jobs]]
id = "factorized"
path = "../../jobs/scale-equivariant-200/factorized.toml"
display_name = "Scale-Equivariant Factorized FFNN"

[[jobs]]
id = "embedded-factorized"
path = "../../jobs/scale-equivariant-200/embedded-factorized.toml"
display_name = "Scale-Equivariant Embedded Factorized FFNN"

[[jobs]]
id = "scale-equivariant-embedded-softplus-factorized"
path = "../../jobs/scale-equivariant-200/embedded-softplus-factorized.toml"
display_name = "Scale-Equivariant Embedded Softplus Factorized FFNN"

[[jobs]]
id = "scale-equivariant-embedded-factorized-end"
path = "../../jobs/scale-equivariant-200/embedded-factorized-end.toml"
display_name = "Scale-Equivariant Embedded Factorized-End FFNN"

[[jobs]]
id = "scale-equivariant-embedded-softplus-factorized-end"
path = "../../jobs/scale-equivariant-200/embedded-softplus-factorized-end.toml"
display_name = "Scale-Equivariant Embedded Softplus Factorized-End FFNN"

[[jobs]]
id = "scale-equivariant-embedded-fully-factorized"
path = "../../jobs/scale-equivariant-200/embedded-fully-factorized.toml"
display_name = "Scale-Equivariant Embedded Fully Factorized FFNN"

[[jobs]]
id = "scale-equivariant-embedded-fully-softplus-factorized"
path = "../../jobs/scale-equivariant-200/embedded-fully-softplus-factorized.toml"
display_name = "Scale-Equivariant Embedded Fully Softplus Factorized FFNN"

[[jobs]]
id = "scale-equivariant-constant-width-factorized"
path = "../../jobs/scale-equivariant-200/constant-width-factorized.toml"
display_name = "Scale-Equivariant Constant-Width Factorized FFNN"

[[jobs]]
id = "scale-equivariant-constant-width-softplus-factorized"
path = "../../jobs/scale-equivariant-200/constant-width-softplus-factorized.toml"
display_name = "Scale-Equivariant Constant-Width Softplus Factorized FFNN"

[[comparisons]]
id = "gaussian-cg10"
matrix_dataset = "gaussian-cg10-45x15"
rhs_generation = { kind = "gaussian" }
seed = 42

[[comparisons]]
id = "sparse-cg10"
matrix_dataset = "gaussian-cg10-45x15"
rhs_generation = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
id = "scaled-cg10"
matrix_dataset = "gaussian-cg10-45x15"
rhs_dataset = "scaled-solutions-45x15"

[[comparisons]]
id = "gaussian-cg100"
matrix_dataset = "gaussian-cg100-45x15"
rhs_generation = { kind = "gaussian" }
seed = 42

[[comparisons]]
id = "sparse-cg100"
matrix_dataset = "gaussian-cg100-45x15"
rhs_generation = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
id = "scaled-cg100"
matrix_dataset = "gaussian-cg100-45x15"
rhs_dataset = "scaled-solutions-45x15"

