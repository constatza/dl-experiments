# Factorized linear registry for Gaussian residual sweeps — 93x31 matrix.

[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-93x31"
comparison = "Compare-93x31"

# ────────────────────────
# Comparison defaults
# ────────────────────────

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ───────────────────────────────────────────────────────────────────────────
# Datasets
#   Training datasets: res-gaussian-{1,2,5,10,100}-93x31
#   Comparison datasets: solutions + gaussian-rhs (93x31 matrix)
# ───────────────────────────────────────────────────────────────────────────

[[datasets]]
id   = "res-gaussian-1-93x31"
path = "../../datasets/93x31/res-gaussian-1.toml"
display_name = "Residual-Error 1 Gaussian 93x31"

[[datasets]]
id   = "res-gaussian-2-93x31"
path = "../../datasets/93x31/res-gaussian-2.toml"
display_name = "Residual-Error 2 Gaussian 93x31"

[[datasets]]
id   = "res-gaussian-5-93x31"
path = "../../datasets/93x31/res-gaussian-5.toml"
display_name = "Residual-Error 5 Gaussian 93x31"

[[datasets]]
id   = "res-gaussian-10-93x31"
path = "../../datasets/93x31/res-gaussian-10.toml"
display_name = "Residual-Error 10 Gaussian 93x31"

[[datasets]]
id   = "res-gaussian-100-93x31"
path = "../../datasets/93x31/res-gaussian-100.toml"
display_name = "Residual-Error 100 Gaussian 93x31"

[[datasets]]
id   = "solutions"
path = "../../datasets/93x31/solutions.toml"
display_name = "Solutions"

[[datasets]]
id   = "gaussian-rhs"
path = "../../datasets/93x31/gaussian-rhs.toml"
display_name = "Gaussian RHS"

# ───────────────────────
# Models
# ───────────────────────

[[models]]
id   = "factorized-linear"
path = "../../models/linear/factorized.toml"
display_name = "Factorized Linear"

# ───────────────────────────────────────────────────────────────────────────
# Comparisons  (data binding — methodology from [comparison_defaults] above)
# ───────────────────────────────────────────────────────────────────────────

[[comparisons]]
id             = "gaussian"
matrix_dataset = "solutions"
rhs_dataset    = "gaussian-rhs"
display_name   = "Gaussian RHS"

# ───────────────────────
# Experiments
# ───────────────────────

[[experiments]]
id      = "res-gaussian-1-93x31-factorized-linear"
dataset = "res-gaussian-1-93x31"
model   = "factorized-linear"
display_name = "Residual-Error 1 Gaussian 93x31 | Factorized Linear"

[[experiments]]
id      = "res-gaussian-2-93x31-factorized-linear"
dataset = "res-gaussian-2-93x31"
model   = "factorized-linear"
display_name = "Residual-Error 2 Gaussian 93x31 | Factorized Linear"

[[experiments]]
id      = "res-gaussian-5-93x31-factorized-linear"
dataset = "res-gaussian-5-93x31"
model   = "factorized-linear"
display_name = "Residual-Error 5 Gaussian 93x31 | Factorized Linear"

[[experiments]]
id      = "res-gaussian-10-93x31-factorized-linear"
dataset = "res-gaussian-10-93x31"
model   = "factorized-linear"
display_name = "Residual-Error 10 Gaussian 93x31 | Factorized Linear"

[[experiments]]
id      = "res-gaussian-100-93x31-factorized-linear"
dataset = "res-gaussian-100-93x31"
