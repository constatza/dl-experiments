# Scale-equivariant constant-width FFNN registry for Gaussian residual sweeps — 93x31 matrix.

[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-93x31"
comparison = "Compare-93x31"

# ────────────────────────
# Comparison defaults
# ────────────────────────

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ───────────────────────────────────────────────────────────────────────────
# Datasets
#   Training datasets: res-gaussian-{1,2,5,10,100}-93x31
#   Comparison datasets: solutions + gaussian-rhs (93x31 matrix)
# ───────────────────────────────────────────────────────────────────────────

[[datasets]]
id   = "res-gaussian-50-93x31"
path = "../../datasets/93x31/res-gaussian-50.toml"
display_name = "Residual-Error 50 Gaussian 93x31"

[[datasets]]
id   = "solutions"
path = "../../datasets/93x31/solutions.toml"
display_name = "Solutions"

[[datasets]]
id   = "gaussian-rhs"
path = "../../datasets/93x31/gaussian-rhs.toml"
display_name = "Gaussian RHS"

# ───────────────────────
# Models
# ───────────────────────

[[models]]
id   = "scale-equivariant-constant-width-3000"
path = "../../models/scale-equivariant/constant-width-3000.toml"
display_name = "Scale-Equivariant Constant-Width 3000"

# ───────────────────────────────────────────────────────────────────────────
# Comparisons  (data binding — methodology from [comparison_defaults] above)
# ───────────────────────────────────────────────────────────────────────────

[[comparisons]]
id             = "gaussian"
matrix_dataset = "solutions"
rhs_dataset    = "gaussian-rhs"
display_name   = "Gaussian RHS"

# ───────────────────────
# Experiments
# ───────────────────────

[[experiments]]
id      = "res-gaussian-50-93x31-scale-equivariant-constant-width-3000"
dataset = "res-gaussian-50-93x31"
model   = "scale-equivariant-constant-width-3000"
display_name = "Residual-Error 50 Gaussian 93x31 | Scale-Equivariant Constant-Width 3000"
