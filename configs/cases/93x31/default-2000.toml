[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-93x31-POD-2G-CG-2000"
comparison = "Compare-93x31-POD-2G-CG-2000"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg-small-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.05 }

[[comparison_defaults.preconditioners]]
name = "amg-medium-theta"
type = "amg"
coarsening = { method = "aggregation", theta = 0.25 }

[[comparison_defaults.preconditioners]]
name = "amg-target-dim"
type = "amg"
coarsening = { method = "target_dim", target_coarse_dim = 700 }

[[comparison_defaults.preconditioners]]
name = "pod-2g_0-cg"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-0cg-93x31-2000", n_snapshots = -1, rank = 0.9999 }

[[comparison_defaults.preconditioners]]
name = "pod-2g_cg-10"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-cg10-93x31-2000", n_snapshots = -1, rank = 0.9999 }

[[comparison_defaults.preconditioners]]
name = "pod-2g_cg-50"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/gaussian-cg50-93x31-2000", n_snapshots = -1, rank = 0.9999 }

[[datasets]]
path = "../../datasets/train/93x31/gaussian-0cg-2000.toml"
display_name = "Gaussian 0-CG 93x31, 2000 samples (POD-2G snapshots)"

[[datasets]]
path = "../../datasets/train/93x31/gaussian-cg10-2000.toml"
display_name = "Gaussian CG-10 93x31, 2000 samples (POD-2G snapshots)"

[[datasets]]
path = "../../datasets/train/93x31/gaussian-cg50-2000.toml"
display_name = "Gaussian CG-50 93x31, 2000 samples (POD-2G snapshots)"

[[comparisons]]
matrix_dataset = "gaussian-cg50-93x31-2000"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg50-93x31-2000"
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
matrix_dataset = "gaussian-cg50-93x31-2000"
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/93x31-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }
