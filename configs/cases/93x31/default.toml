[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train-93x31-Scale-Equivariant-CG"
comparison = "Compare-93x31-Scale-Equivariant-CG"

[comparison_defaults]
rtol = 1.0e-6
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

[[comparison_defaults.preconditioners]]
name = "amg"
type = "amg"
coarsening = { method = "aggregation", theta = 0.05 }

[[comparison_defaults.preconditioners]]
name = "pod2g-cg1"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/solutions-cg1-93x31", n_snapshots = -1, rank = 0.9999 }

[[comparison_defaults.preconditioners]]
name = "pod2g-cg10"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/solutions-cg10-93x31", n_snapshots = -1, rank = 0.9999 }

[[comparison_defaults.preconditioners]]
name = "pod2g-cg50"
type = "amg"
coarsening = { method = "pod", dataset_dir = "${NEURALLS_PROCESSED_DIR}/solutions-cg50-93x31", n_snapshots = -1, rank = 0.9999 }

[[datasets]]
id = "gaussian-cg100-93x31"
path = "../../datasets/train/93x31/gaussian-cg100.toml"
display_name = "Gaussian CG-100 93x31"

[[datasets]]
id = "solutions-cg1-93x31"
path = "../../datasets/train/93x31/solutions-cg1.toml"
display_name = "Solutions (plain, 0 CG iterations) 93x31 (POD-2G snapshot source)"

[[datasets]]
id = "solutions-cg10-93x31"
path = "../../datasets/train/93x31/solutions-cg10.toml"
display_name = "Solutions CG-10 93x31 (POD-2G snapshot source)"

[[datasets]]
id = "solutions-cg50-93x31"
path = "../../datasets/train/93x31/solutions-cg50.toml"
display_name = "Solutions CG-50 93x31 (POD-2G snapshot source)"

[[datasets]]
id = "sparse-rhs-93x31"
path = "../../datasets/test/93x31/sparse-rhs.toml"
display_name = "Sparse RHS 93x31"

[[jobs]]
id = "scale-equivariant-embedded-factorized"
path = "../../jobs/93x31/scale-equivariant-embedded-factorized.toml"
display_name = "Scale Equivariant Embedded FFNN (GELU, 4L, bias)"

[[jobs]]
id = "scale-equivariant-embedded-hyper"
path = "../../jobs/93x31/scale-equivariant-embedded-hyper.toml"
display_name = "Scale Equivariant Embedded Hyper FFNN (GELU, 4L, 2 lanes)"

[[jobs]]
id = "scale-equivariant-embedded-moe"
path = "../../jobs/93x31/scale-equivariant-embedded-moe.toml"
display_name = "Scale Equivariant Embedded MoE FFNN (GELU, 4L, 4 experts, top-2)"

[[comparisons]]
matrix_dataset = "gaussian-cg100-93x31"
rhs_source = { kind = "gaussian" }
seed = 42

[[comparisons]]
matrix_dataset = "gaussian-cg100-93x31"
rhs_source = { kind = "sparse", indices = [0, 1, -1], values = [90.0, 100.0, -100.0] }

[[comparisons]]
matrix_dataset = "gaussian-cg100-93x31"
rhs_source = { kind = "raw_lhs", path = "${NEURALLS_RAW_DIR}/SpectralData/93x31-displacements/UaVectorsFromSpectral/ua_vector from_spectral_no_realization_0.txt", row_kind = "standard", scale = 1.0 }

[[assignments]]
dataset = "gaussian-cg100-93x31"
job = "scale-equivariant-embedded-factorized"

[[assignments]]
dataset = "gaussian-cg100-93x31"
job = "scale-equivariant-embedded-hyper"

[[assignments]]
dataset = "gaussian-cg100-93x31"
job = "scale-equivariant-embedded-moe"
