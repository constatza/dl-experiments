[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-93x31-All"
comparison = "Compare-93x31-All"

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ── Training datasets (max CG-iter only) ─────────────────────────────────────

[[datasets]]
id           = "gaussian-cg100-93x31"
path         = "../../datasets/train/93x31/gaussian-cg100.toml"
display_name = "Gaussian CG-100 93x31"

# ── Test / compare datasets ───────────────────────────────────────────────────

[[datasets]]
id           = "gaussian-rhs-93x31"
path         = "../../datasets/test/93x31/gaussian-rhs.toml"
display_name = "Gaussian RHS 93x31"

[[datasets]]
id           = "sparse-rhs-93x31"
path         = "../../datasets/test/93x31/sparse-rhs.toml"
display_name = "Sparse RHS 93x31"

# ── Models ────────────────────────────────────────────────────────────────────

[[models]]
id           = "ffnn-standard"
path         = "../../models/ffnn/standard.toml"
display_name = "FFNN Standard"

[[models]]
id           = "embedded-factorized"
path         = "../../models/embedded/embedded-factorized.toml"
display_name = "Embedded Factorized"

[[models]]
id           = "symmetric-embedded-spd"
path         = "../../models/symmetric/embedded-spd.toml"
display_name = "Symmetric Embedded SPD"

[[models]]
id           = "symmetric-embedded-spd-factorized"
path         = "../../models/symmetric/embedded-spd-factorized.toml"
display_name = "Symmetric Embedded SPD-Factorized"

[[models]]
id           = "symmetric-spd"
path         = "../../models/symmetric/spd.toml"
display_name = "Symmetric SPD"

[[models]]
id           = "symmetric-spd-factorized"
path         = "../../models/symmetric/spd-factorized.toml"
display_name = "Symmetric SPD-Factorized"

[[models]]
id           = "spectral-siren"
path         = "../../models/spectral/siren.toml"
display_name = "Spectral SIREN"

[[models]]
id           = "spectral-fourier"
path         = "../../models/spectral/fourier.toml"
display_name = "Spectral Fourier"

[[models]]
id           = "spectral-modified-mlp"
path         = "../../models/spectral/modified-mlp.toml"
display_name = "Spectral Modified MLP"

[[models]]
id           = "spectral-factorized"
path         = "../../models/spectral/factorized.toml"
display_name = "Spectral Factorized"

# ── Comparisons ───────────────────────────────────────────────────────────────

[[comparisons]]
id             = "gaussian"
matrix_dataset = "gaussian-rhs-93x31"
rhs_dataset    = "gaussian-rhs-93x31"

[[comparisons]]
id             = "sparse"
matrix_dataset = "sparse-rhs-93x31"
rhs_dataset    = "sparse-rhs-93x31"

# ── Experiments (10 models × gaussian-cg100-93x31) ───────────────────────────

[[experiments]]
dataset      = "gaussian-cg100-93x31"
model        = "ffnn-standard"

[[experiments]]
dataset      = "gaussian-cg100-93x31"
model        = "embedded-factorized"

[[experiments]]
dataset      = "gaussian-cg100-93x31"
model        = "symmetric-embedded-spd"

[[experiments]]
dataset      = "gaussian-cg100-93x31"
model        = "symmetric-embedded-spd-factorized"

[[experiments]]
dataset      = "gaussian-cg100-93x31"
model        = "symmetric-spd"

[[experiments]]
dataset      = "gaussian-cg100-93x31"
model        = "symmetric-spd-factorized"

[[experiments]]
dataset      = "gaussian-cg100-93x31"
model        = "spectral-siren"

[[experiments]]
dataset      = "gaussian-cg100-93x31"
model        = "spectral-fourier"

[[experiments]]
dataset      = "gaussian-cg100-93x31"
model        = "spectral-modified-mlp"

[[experiments]]
dataset      = "gaussian-cg100-93x31"
model        = "spectral-factorized"
