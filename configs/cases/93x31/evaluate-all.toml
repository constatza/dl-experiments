[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-93x31-All"
comparison = "Compare-93x31-All"

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ── Training datasets (max CG-iter only) ─────────────────────────────────────

[[datasets]]
id           = "gaussian-cg10-93x31"
path         = "../../datasets/train/93x31/gaussian-cg10.toml"
display_name = "Gaussian CG-10 93x31"

[[datasets]]
id           = "gaussian-cg100-93x31"
path         = "../../datasets/train/93x31/gaussian-cg100.toml"
display_name = "Gaussian CG-100 93x31"

# ── Test / compare datasets ───────────────────────────────────────────────────

[[datasets]]
id           = "sparse-rhs-93x31"
path         = "../../datasets/test/93x31/sparse-rhs.toml"
display_name = "Sparse RHS 93x31"

# ── Models ────────────────────────────────────────────────────────────────────

[[jobs]]
id           = "ffnn-standard"
path         = "../../jobs/ffnn/ffnn.toml"
display_name = "FFNN Standard"

[[jobs]]
id           = "embedded-factorized"
path         = "../../jobs/ffnn/embedded-factorized.toml"
display_name = "Embedded Factorized"

# ── Comparisons ───────────────────────────────────────────────────────────────

[[comparisons]]
id             = "gaussian"
matrix_dataset = "gaussian-cg10-93x31"
rhs_dataset    = "gaussian-cg10-93x31"

[[comparisons]]
id             = "sparse"
matrix_dataset = "gaussian-cg10-93x31"
rhs_dataset    = "sparse-rhs-93x31"

# ── Experiments (2 models × gaussian-cg100-93x31) ────────────────────────────

[[experiments]]
dataset      = "gaussian-cg100-93x31"
job = "ffnn-standard"

[[experiments]]
dataset      = "gaussian-cg100-93x31"
job = "embedded-factorized"
