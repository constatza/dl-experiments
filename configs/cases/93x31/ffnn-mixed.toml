[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train-93x31-FFNN-Mixed"
comparison = "Compare-93x31-FFNN-Mixed"

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ── Training datasets (all CG-iter variants) ──────────────────────────────────

[[datasets]]
id           = "gaussian-cg1-93x31"
path         = "../../datasets/train/93x31/gaussian-cg1.toml"
display_name = "Gaussian CG-1 93x31"

[[datasets]]
id           = "gaussian-cg10-93x31"
path         = "../../datasets/train/93x31/gaussian-cg10.toml"
display_name = "Gaussian CG-10 93x31"

[[datasets]]
id           = "gaussian-cg50-93x31"
path         = "../../datasets/train/93x31/gaussian-cg50.toml"
display_name = "Gaussian CG-50 93x31"

[[datasets]]
id           = "gaussian-cg100-93x31"
path         = "../../datasets/train/93x31/gaussian-cg100.toml"
display_name = "Gaussian CG-100 93x31"

# ── Test / compare datasets ───────────────────────────────────────────────────

[[datasets]]
id           = "gaussian-rhs-93x31"
path         = "../../datasets/test/93x31/gaussian-rhs.toml"
display_name = "Gaussian RHS 93x31"

[[datasets]]
id           = "sparse-rhs-93x31"
path         = "../../datasets/test/93x31/sparse-rhs.toml"
display_name = "Sparse RHS 93x31"

# ── Models ────────────────────────────────────────────────────────────────────

[[models]]
id           = "ffnn-standard"
path         = "../../models/ffnn/standard.toml"
display_name = "FFNN Standard"

# ── Comparisons ───────────────────────────────────────────────────────────────

[[comparisons]]
id             = "gaussian"
matrix_dataset = "gaussian-rhs-93x31"
rhs_dataset    = "gaussian-rhs-93x31"

[[comparisons]]
id             = "sparse"
matrix_dataset = "sparse-rhs-93x31"
rhs_dataset    = "sparse-rhs-93x31"

# ── Experiments (ffnn-standard × 4 training datasets) ────────────────────────

[[experiments]]
dataset      = "gaussian-cg1-93x31"
model        = "ffnn-standard"

[[experiments]]
dataset      = "gaussian-cg10-93x31"
model        = "ffnn-standard"

[[experiments]]
dataset      = "gaussian-cg50-93x31"
model        = "ffnn-standard"

[[experiments]]
dataset      = "gaussian-cg100-93x31"
model        = "ffnn-standard"
