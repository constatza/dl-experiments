# Global path configuration
[paths]
output_root = "/data/projects/graph-cg/data/output"
mlruns_dir = "/data/projects/graph-cg/data/mlruns"
mlartifacts_dir = "/data/projects/graph-cg/data/mlartifacts"
common_output_root = "/data/projects/graph-cg/data"

# Experiment matrix for graph-cg error-based neural solver training
#
# Each experiment combines a model template, data config, and solver config.
# The workflow will:
# 1. Generate data according to the data_config
# 2. Train the model with paths automatically resolved to the generated data
# 3. Run comparison with solver config
#
# Paths are AUTO-DERIVED using convention:
#   output_dir:      {output_root}/{data_config_stem}/{model_name}/
#   checkpoint_path: {output_root}/{data_config_stem}/{model_name}/checkpoints/{model_name}.ckpt
#
# Optional checkpoint_path override:
#   To compare different checkpoint versions, specify checkpoint_path explicitly:
#
#   [[experiments]]
#   model_template = "configs/ffnn.toml"
#   data_config = "data-configs/test-solutions.toml"
#   checkpoint_path = "/data/.../ffnn_v1.ckpt"  # Absolute path
#
#   [[experiments]]
#   model_template = "configs/ffnn.toml"
#   data_config = "data-configs/test-solutions.toml"
#   checkpoint_path = "data/output/.../ffnn_v2.ckpt"  # Relative to project root
#
# If checkpoint_path is omitted, the convention-based path is used automatically.
#
# Data configs define:
# - Matrix dimensions (90, 280, 504, 2040)
# - Generation strategy (cg_residual_error for error-based training)
# - Normalization settings
#
# Model configs define:
# - Architecture (FFNN variants, GNN, Linear)
# - Training hyperparameters
# - Optimizer/scheduler settings
#
# Solver configs define:
# - CG tolerances and max iterations
# - Preconditioner configurations
# - Solver-specific parameters

# Test experiments with eigenvector and vanilla solution-based datasets
# These experiments test CG performance with high-precision data
[[experiments]]
model_template = "ffnn.toml"
data_config = "../data-configs/test-solutions.toml"
solver_config = "../solver-configs/default.toml"

[[experiments]]
model_template = "ffnn.toml"
data_config = "../data-configs/test-eigenvector-largest.toml"
solver_config = "../solver-configs/default.toml"

[[experiments]]
model_template = "ffnn.toml"
data_config = "../data-configs/test-eigenvector-smallest.toml"
solver_config = "../solver-configs/default.toml"

[[experiments]]
model_template = "linear.toml"
data_config = "../data-configs/test-solutions.toml"
solver_config = "../solver-configs/default.toml"

