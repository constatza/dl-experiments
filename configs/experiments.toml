path = "datasets/eig-solutions-smallest.toml"
display_name = "Eig Solutions Smallest"

[[datasets]]
id = "eig-solutions-largest"
path = "datasets/eig-solutions-largest.toml"
display_name = "Eig Solutions Largest"

[[datasets]]
id = "gaussian"
