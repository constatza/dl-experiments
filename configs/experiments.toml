# Master configuration file for all experiments.
# Format: [[experiment]] entries with dataset + model refs.
# Checkpoint paths are no longer stored here — they are resolved
# via ComparisonRun produced by train-multiple.

project_root = ".."
output_dir = "/data/projects/graph-cg/data/output"

[comparisons]
tracking_uri      = "sqlite:////data/projects/graph-cg/data/comparisons/mlflow.db"
artifact_location = "/data/projects/graph-cg/data/comparisons/mlartifacts"

[[experiment]]
id = "linear_test_solutions"
dataset = "solutions"
model = "linear"

[[experiment]]
id = "linear_test_eigenvector_solutions_largest"
dataset = "eigenvector-solutions-largest"
model = "linear"

[[experiment]]
id = "linear_test_eigenvector_solutions_smallest"
dataset = "eigenvector-solutions-smallest"
model = "linear"

[[experiment]]
id = "linear_test_eigenvector_rhs_largest"
dataset = "eigenvector-rhs-largest"
model = "linear"

[[experiment]]
id = "linear_test_eigenvector_rhs_smallest"
dataset = "eigenvector-rhs-smallest"
model = "linear"
