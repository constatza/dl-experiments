# Master configuration file for all experiments.
# New format: [[experiment]] entries with dataset + model + solver + checkpoint references

project_root = ".."
output_dir = "/data/projects/graph-cg/data/output"

# Experiment definitions: dataset + model + solver + explicit checkpoint path
# Each experiment is a unique combination of dataset and model

[[experiment]]
id = "ffnn_test_solutions"
dataset = "test-solutions"
model = "ffnn"
solver = "default"
checkpoint_path = "/data/projects/graph-cg/data/output/test-solutions/NormScaledConstantWidthFFNN/checkpoints/ffnn.ckpt"

