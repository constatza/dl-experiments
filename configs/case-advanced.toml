# Advanced single-input model registry for residual dataset sweeps.

[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training = "Train"
comparison = "Comparisons"

# -------
# Dataset
# -------

[[datasets]]
id = "residuals-100"
path = "datasets/residuals-100.toml"
display_name = "Residual-Error 100"

[[datasets]]
id = "res-gaussian-100"
path = "datasets/res-gaussian-100.toml"
display_name = "Residual-Error 100 Gaussian"

[[datasets]]
id = "res-gaussian-0"
path = "datasets/res-gaussian-0.toml"
display_name = "Residual-Error 0 Gaussian"

[[datasets]]
id = "res-gaussian-10"
path = "datasets/res-gaussian-10.toml"
display_name = "Residual-Error 10 Gaussian"

[[datasets]]
id = "res-gaussian-20"
path = "datasets/res-gaussian-20.toml"
display_name = "Residual-Error 20 Gaussian"

[[datasets]]
id = "res-gaussian-50"
path = "datasets/res-gaussian-50.toml"
display_name = "Residual-Error 50 Gaussian"

[[datasets]]
id = "res-gaussian-100-93x31"
path = "datasets/res-gaussian-100-93x31.toml"
display_name = "Residual-Error 100 Gaussian 93x31"

# ------
# Models
# ------

[[models]]
id = "siren"
path = "models/advanced/siren.toml"
display_name = "SIREN"

[[models]]
id = "siren-lbfgs"
path = "models/advanced/siren-lbfgs.toml"
display_name = "SIREN-LBFGS"

[[models]]
id = "modified-mlp"
path = "models/advanced/modified-mlp.toml"
display_name = "Modified MLP"

[[models]]
id = "modified-mlp-lbfgs"
path = "models/advanced/modified-mlp-lbfgs.toml"
display_name = "Modified-MLP-LBFGS"

# -----------
# Comparisons
# -----------

[[comparisons]]
id = "gaussian"
path = "comparison/gaussian.toml"
display_name = "Gaussian RHS"

[[comparisons]]
id = "scaled-solutions"
path = "comparison/scaled-solutions.toml"
display_name = "Scaled Solutions"

[[comparisons]]
id = "sparse-rhs"
path = "comparison/sparse-rhs.toml"
display_name = "Sparse RHS"

[[comparisons]]
id = "eig-few-solutions-smallest"
path = "comparison/eig-few-solutions-smallest.toml"
display_name = "Eig Few Solutions Smallest"

[[comparisons]]
id = "eig-few-rhs-smallest"
path = "comparison/eig-few-rhs-smallest.toml"
display_name = "Eig Few RHS Smallest"

# -----------
# Experiments
# -----------


[[experiments]]
id = "residuals-100-siren"
dataset = "residuals-100"
model = "siren"
display_name = "Residual-Error 100 | SIREN"

[[experiments]]
 id = "res-gaussian-100-siren"
 dataset = "res-gaussian-100"
model = "siren"
display_name = "Residual-Error 100 Gaussian | SIREN"

[[experiments]]
 id = "res-gaussian-100-siren-lbfgs"
 dataset = "res-gaussian-100"
model = "siren-lbfgs"
display_name = "Residual-Error 100 Gaussian | SIREN-LBFGS"

[[experiments]]
id = "residuals-100-modified-mlp"
dataset = "residuals-100"
model = "modified-mlp"
display_name = "Residual-Error 100 | Modified MLP"

[[experiments]]
 id = "res-gaussian-100-modified-mlp"
 dataset = "res-gaussian-100"
model = "modified-mlp"
display_name = "Residual-Error 100 Gaussian | Modified MLP"

[[experiments]]
 id = "res-gaussian-100-modified-mlp-lbfgs"
 dataset = "res-gaussian-100"
model = "modified-mlp-lbfgs"
display_name = "Residual-Error 100 Gaussian | Modified MLP LBFGS"
