[SESSION]
seed = 42
workflow = "optimize"
precision = "64"

[MODEL]
name = "ScaleEquivariantFactorizedFFNN"
module_path = "dlkit.nn"
num_layers = 1
bias = true
mean = 0.0
std = 0.1
norm = "l2"
dropout = 0.0

[TRAINING.lr_tuner]
min_lr = 1e-5
max_lr = 1e-2
num_training = 100
mode = "linear"

[TRAINING.trainer]
max_epochs = 300
accelerator = "auto"
enable_checkpointing = true

[[TRAINING.trainer.callbacks]]
name = "ModelCheckpoint"
filename = "factorized-optuna"
monitor = "val_loss"
save_top_k = 1
save_weights_only = false
enable_version_counter = false

[[TRAINING.trainer.callbacks]]
name = "EarlyStopping"
monitor = "val_loss"
min_delta = 1e-4
patience = 30
mode = "min"
check_finite = true

[TRAINING.optimizer.default_optimizer]
name = "AdamW"
lr = 1e-3
weight_decay = 1e-2

[TRAINING.optimizer.default_scheduler]
name = "ReduceLROnPlateau"
mode = "min"
factor = 0.5
patience = 10
cooldown = 5
threshold = 1e-4
min_lr = 1e-6

[TRAINING.loss_function]
name = "relative_vector_norm_loss"
module_path = "dlkit.domain.losses"
target_key = "targets.y"

[[TRAINING.metrics]]
name = "RelativeVectorNormError"
module_path = "dlkit.domain.metrics"
norm_ord = 2
vector_dim = -1

[DATASET]
name = "FlexibleDataset"

[DATAMODULE]
name = "ArrayDataModule"

[DATAMODULE.dataloader]
batch_size = 256
pin_memory = true
shuffle = true

[OPTUNA]
enabled = true
n_trials = 40

[OPTUNA.model]
num_layers = {choices = [1, 2, 4]}
dropout = {low = 0.0, high = 0.5, step = 0.05}
norm = {choices = ["l2", "none"]}
std = {choices = [0.01, 0.1, 1.0]}
