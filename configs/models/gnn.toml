[SESSION]
# Random seed for reproducibility
seed = 42
# Computation precision preset (e.g., medium, high)
precision = "float64"

[MODEL]
# Model class path - using new dlkit GATv2Projection
name = "ScaledGATv2Projection"
module_path = "dlkit.nn.graph"
hidden_size = 12
num_layers = 3
#dropout = 0.1

[TRAINING]
# Checkpoint to resume training from (full training state)
# resume_from_checkpoint = "output/checkpoints/gnn.ckpt"
#[training.lr_tuner]

[TRAINING.trainer]
# Maximum number of epochs (Lightning Trainer)
max_epochs = 800
# Hardware accelerator: cpu | gpu | auto | tpu
accelerator = "auto"
# Enable checkpointing
enable_checkpointing = true
enable_version_counter = false

[TRAINING.optimizer]
# Optimizer name and settings
lr = 1e-3

[TRAINING.scheduler]
name = "ReduceLROnPlateau"
factor = 0.5
patience = 30
min_lr = 1e-14

# Model checkpoint callback configuration
[[TRAINING.trainer.callbacks]]
name = "ModelCheckpoint"
filename = "gnn"
monitor = "val_loss"
save_top_k = 1
save_weights_only = false
every_n_epochs = 1
enable_version_counter = false

[[TRAINING.metrics]]
name = "NormalizedVectorNormError"
module_path = "dlkit.core.training.metrics"
norm_ord = 2
vector_dim = -1

[DATAMODULE]
# DataModule class for graph data
name = "GraphDataModule"

[DATAMODULE.dataloader]
num_workers = 0
batch_size = 32  # Reduced for small eigenvector dataset (504 samples → ~15 batches)
pin_memory = true
shuffle = true

[DATASET]
name = "GraphDataset"

# GraphDataset configuration (dlkit.core.datasets.graph.GraphDataset)
#
# Dataset uses PRE-NORMALIZED data from the data generation pipeline.
# Data is normalized during generation (see data_pipeline.py) and saved as normalized.npz.
# NO additional transforms are applied during training to avoid double normalization.
#
# Features/targets are injected programmatically at runtime with in-memory arrays (not file paths).
# This follows dlkit's hybrid TOML + Python configuration pattern.
#
# Runtime injection provides (via src/cli/training.py):
# - x: In-memory RHS vectors as node features (from normalized.npz)
# - edge_index: In-memory adjacency matrix (shared across all samples)
# - y: In-memory solution vectors as targets (from normalized.npz)
#
# For our linear system Ax=b:
# - Each sample gets its RHS vector as node features
# - All samples share the same edge structure from matrix A
# - Each sample has its corresponding solution as target

[MLFLOW]
# Enable MLflow tracking
enabled = true

[MLFLOW.server]
# MLflow server backend database and artifacts storage
backend_store_uri = "sqlite:////data/projects/graph-cg/data/output/mlruns/mlflow.db"
artifacts_destination = "/data/projects/graph-cg/data/output/mlartifacts"

[MLFLOW.client]
# Connect to flow-level MLflow server started by workflow
tracking_uri = "http://127.0.0.1:5000"

[OPTUNA]
# Hyperparameter optimization settings
enabled = false
n_trials = 40

[OPTUNA.model]
hidden_size = {low=2, high=100, step= 10}
num_layers = {low=1, high=10, step=1}
drop = {low=0, high=0.5, step=0.1}
