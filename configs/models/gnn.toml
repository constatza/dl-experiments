[SESSION]
# Random seed for reproducibility
seed = 42
workflow = "train"
# Computation precision preset (e.g., medium, high)
precision = "float64"

[MODEL]
# Residual graph attention model.
name = "ScaledGATv2Projection"
module_path = "dlkit.domain.nn.graph"
hidden_size = 12
num_layers = 3
heads = 1
edge_dim = 1
concat = true
dropout = 0.0

[TRAINING]
# Checkpoint to resume training from (full training state)
# resume_from_checkpoint = "output/checkpoints/gnn.ckpt"
#[training.lr_tuner]

[TRAINING.trainer]
# Maximum number of epochs (Lightning Trainer)
max_epochs = 300
# Hardware accelerator: cpu | gpu | auto | tpu
accelerator = "auto"
# Enable checkpointing
enable_checkpointing = true

[TRAINING.optimizer.default_optimizer]
name = "Concurrent"
optimizers = [
  { name = "BatchedMuon", lr = 1e-3, momentum = 0.95, nesterov = true, ns_steps = 5 },
  { name = "AdamW", lr = 3e-4, weight_decay = 1e-2 },
]

[TRAINING.optimizer.default_scheduler]
name = "ReduceLROnPlateau"
mode = "min"
factor = 0.5
patience = 10
cooldown = 5
threshold = 1e-4
min_lr = 1e-6

[TRAINING.loss_function]
name = "normalized_vector_norm_loss"
module_path = "dlkit.domain.losses"
target_key = "targets.solutions"

# Model checkpoint callback configuration
[[TRAINING.trainer.callbacks]]
name = "ModelCheckpoint"
filename = "gnn"
monitor = "val_loss"
save_top_k = 1
save_weights_only = false
enable_version_counter = false

[[TRAINING.trainer.callbacks]]
name = "EarlyStopping"
monitor = "val_loss"
min_delta = 1e-4
patience = 30
mode = "min"
check_finite = true

[[TRAINING.metrics]]
name = "NormalizedVectorNormError"
module_path = "dlkit.domain.metrics"
norm_ord = 2
vector_dim = -1

[DATAMODULE]
# DataModule class for graph data
name = "GraphDataModule"

[DATAMODULE.dataloader]
num_workers = 0
batch_size = 32  # Reduced for small eigenvector dataset (504 samples → ~15 batches)
pin_memory = true
shuffle = true

[DATASET]
name = "GraphDataset"

# GraphDataset configuration (dlkit.engine.data.datasets.graph.GraphDataset)
#
# Dataset uses PRE-NORMALIZED data from the data generation pipeline.
# Data is normalized during generation and saved as split arrays + manifest.
# NO additional transforms are applied during training to avoid double normalization.
#
# Features/targets are injected programmatically at runtime as path-based entries.
# This follows dlkit's hybrid TOML + Python configuration pattern.
#
# Runtime injection provides (via src/cli/training.py):
# - x: RHS vectors as node features (from rhs.npy)
# - edge_index: In-memory adjacency matrix (shared across all samples)
# - y: Solution vectors as targets (from solutions.npy)
#
# For our linear system Ax=b:
# - Each sample gets its RHS vector as node features
# - All samples share the same edge structure from matrix A
# - Each sample has its corresponding solution as target
[OPTUNA]
# Hyperparameter optimization settings
enabled = false
n_trials = 40

[OPTUNA.model]
hidden_size = {low=2, high=100, step= 10}
num_layers = {low=1, high=10, step=1}
drop = {low=0, high=0.5, step=0.1}
