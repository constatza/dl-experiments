[SESSION]
seed = 42
precision = "float64"

[MODEL]
# Single linear layer (no hidden layers)
name = "NormScaledLinearFFNN"
module_path = "dlkit.nn.ffnn"

[TRAINING]
# Checkpoint to resume training from (full training state)
# resume_from_checkpoint = "/data/projects/graph-cg/data/output/checkpoints/linear.ckpt"
[TRAINING.lr_tuner]
min_lr = 1e-5
max_lr = 1e-1
num_training = 100
mode = "linear"

[TRAINING.trainer]
max_epochs = 400
accelerator = "auto"
enable_checkpointing = true

[[TRAINING.trainer.callbacks]]
name = "ModelCheckpoint"
filename = "linear"
monitor = "val_loss"
save_top_k = 1
save_weights_only = false
every_n_epochs = 50
enable_version_counter = false

[TRAINING.optimizer]
lr = 5e-2

[TRAINING.scheduler]
name = "ReduceLROnPlateau"
factor = 0.5
patience = 15
min_lr = 1e-14

[TRAINING.loss_function]
name = "relative_energy_norm_loss"
module_path = "dlkit.core.training.functional"
target_key = "targets.solutions"
extra_inputs = [{ key = "features.matrix", arg = "matrix" }]

[[TRAINING.metrics]]
name = "NormalizedVectorNormError"
module_path = "dlkit.core.training.metrics"
norm_ord = 2
vector_dim = -1

[DATASET]
# Dataset uses PRE-NORMALIZED data from the data generation pipeline.
# Data is normalized during generation and saved as split arrays + manifest.
# NO additional transforms are applied during training to avoid double normalization.
# Features/targets are injected programmatically at runtime as path-based entries.
name = "FlexibleDataset"
memmap_cache = true

[DATAMODULE]

name = "InMemoryModule"

[DATAMODULE.dataloader]
num_workers = 0
batch_size = 32  # Reduced for small eigenvector dataset (504 samples → ~15 batches)
pin_memory = true
shuffle = true

[MLFLOW]
enabled = true

[MLFLOW.server]
# MLflow server backend database and artifacts storage
backend_store_uri = "sqlite:////data/projects/graph-cg/data/output/mlruns/mlflow.db"
artifacts_destination = "/data/projects/graph-cg/data/output/mlartifacts"

[MLFLOW.client]
# Connect to flow-level MLflow server started by workflow
tracking_uri = "http://127.0.0.1:5000"

[OPTUNA]
enabled = false
