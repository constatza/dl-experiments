[SESSION]
seed = 42
workflow = "train"
precision = "64"

[MODEL]
name = "ScaleEquivariantConstantWidthFactorizedFFNN"
num_layers = 1

[TRAINING.lr_tuner]
min_lr = 1e-5
max_lr = 1e-2
num_training = 100
mode = "linear"

[TRAINING.trainer]
max_epochs = 300
accelerator = "auto"
enable_checkpointing = true

[[TRAINING.trainer.callbacks]]
name = "ModelCheckpoint"
filename = "scale-equivariant-constant-width-factorized"
monitor = "val_loss"
save_top_k = 1
save_weights_only = false
enable_version_counter = false

[[TRAINING.trainer.callbacks]]
name = "EarlyStopping"
monitor = "val_loss"
min_delta = 1e-4
patience = 30
mode = "min"
check_finite = true

[TRAINING.optimizer.default_optimizer]
name = "AdamW"
lr = 1e-3
weight_decay = 1e-2

[TRAINING.optimizer.default_scheduler]
name = "ReduceLROnPlateau"
mode = "min"
factor = 0.5
patience = 10
cooldown = 5
threshold = 1e-4
min_lr = 1e-6

[TRAINING.loss_function]
name = "relative_vector_norm_loss"
module_path = "dlkit.domain.losses"
target_key = "targets.y"

[[TRAINING.metrics]]
name = "RelativeVectorNormError"
module_path = "dlkit.domain.metrics"
norm_ord = 2
vector_dim = -1

[DATASET]
name = "FlexibleDataset"

[DATAMODULE]
name = "ArrayDataModule"

[DATAMODULE.dataloader]
batch_size = 256
pin_memory = true
shuffle = true
