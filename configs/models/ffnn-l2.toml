[SESSION]
seed = 42
precision = "float64"

[MODEL]
# NormScaled constant-width FFNN optimized with relative L2 loss
name = "NormScaledConstantWidthFFNN"
module_path = "dlkit.nn"
hidden_size = 500
num_layers = 1

[TRAINING]
[TRAINING.lr_tuner]
min_lr = 1e-5
max_lr = 1e-1
num_training = 100
mode = "linear"

[TRAINING.trainer]
max_epochs = 300
accelerator = "auto"
enable_checkpointing = true

[[TRAINING.trainer.callbacks]]
name = "ModelCheckpoint"
filename = "ffnn-l2"
monitor = "val_loss"
save_top_k = 1
save_weights_only = false
every_n_epochs = 50
enable_version_counter = false

[TRAINING.optimizer]
lr = 1e-2
name = "AdamW"

[TRAINING.scheduler]
name = "ReduceLROnPlateau"
factor = 0.5
patience = 15
min_lr = 1e-14

[TRAINING.loss_function]
name = "normalized_vector_norm_loss"
module_path = "dlkit.domain.losses"
target_key = "targets.solutions"

[[TRAINING.metrics]]
name = "RelativeEnergyNormError"
module_path = "dlkit.domain.metrics"
extra_inputs = [{ key = "features.matrix", arg = "matrix" }]

[DATASET]
name = "FlexibleDataset"
memmap_cache = true

[DATAMODULE]
name = "InMemoryModule"

[DATAMODULE.dataloader]
num_workers = 0
batch_size = 32
pin_memory = true
shuffle = true
[OPTUNA]
enabled = false
