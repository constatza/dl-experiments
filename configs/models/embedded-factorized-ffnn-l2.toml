[SESSION]
seed = 42
precision = "float64"

[MODEL]
# Norm-scaled embedded FFNN with factorized parametric body layers.
name = "NormScaledEmbeddedFactorizedFFNN"
module_path = "dlkit.nn.ffnn"
hidden_size = 500
num_layers = 3
residual = true

[TRAINING]
[TRAINING.lr_tuner]
min_lr = 1e-5
max_lr = 1e-1
num_training = 100
mode = "linear"

[TRAINING.trainer]
max_epochs = 300
accelerator = "auto"
enable_checkpointing = true

[[TRAINING.trainer.callbacks]]
name = "ModelCheckpoint"
filename = "embedded-factorized-ffnn-l2"
monitor = "val_loss"
save_top_k = 1
save_weights_only = false
every_n_epochs = 50
enable_version_counter = false

[[TRAINING.trainer.callbacks]]
name = "EarlyStopping"
monitor = "val_loss"
patience = 60
mode = "min"

[TRAINING.optimizer]
lr = 1e-2
name = "AdamW"

[TRAINING.scheduler]
name = "ReduceLROnPlateau"
factor = 0.2
patience = 5
cooldown = 10
threshold = 1e-2
min_lr = 1e-14

[TRAINING.loss_function]
name = "normalized_vector_norm_loss"
module_path = "dlkit.core.training.functional"
target_key = "targets.solutions"

[[TRAINING.metrics]]
name = "NormalizedVectorNormError"
module_path = "dlkit.core.training.metrics"
norm_ord = 2
vector_dim = -1

[DATASET]
name = "FlexibleDataset"
memmap_cache = true

[DATAMODULE]
name = "InMemoryModule"

[DATAMODULE.dataloader]
num_workers = 0
batch_size = 32
pin_memory = true
shuffle = true

[OPTUNA]
enabled = false
