[SESSION]
seed = 42
workflow = "train"
precision = "float64"

[MODEL]
# Single linear layer (no hidden layers)
name = "LinearNetwork"
module_path = "dlkit.nn"

[TRAINING]
# Checkpoint to resume training from (full training state)
# resume_from_checkpoint = "/data/projects/graph-cg/data/output/checkpoints/linear.ckpt"
[TRAINING.lr_tuner]
min_lr = 1e-5
max_lr = 1e-1
num_training = 100
mode = "linear"

[TRAINING.trainer]
max_epochs = 300
accelerator = "auto"
enable_checkpointing = true

[[TRAINING.trainer.callbacks]]
name = "ModelCheckpoint"
filename = "linear"
monitor = "val_loss"
save_top_k = 1
save_weights_only = false
every_n_epochs = 50
enable_version_counter = false

[[TRAINING.optimizer.stages]]

[TRAINING.optimizer.stages.optimizer]
name = "AdamW"
lr = 5e-2

[TRAINING.optimizer.stages.scheduler]
name = "ReduceLROnPlateau"
factor = 0.5
patience = 10
cooldown = 5
threshold = 1e-2
min_lr = 1e-7

[TRAINING.optimizer.stages.trigger]
at_epoch = 200

[[TRAINING.optimizer.stages]]

[TRAINING.optimizer.stages.optimizer]
name = "LBFGS"
lr = 1.0

[TRAINING.loss_function]
name = "normalized_vector_norm_loss"
module_path = "dlkit.domain.losses"
target_key = "targets.solutions"

[[TRAINING.metrics]]
name = "RelativeEnergyNormError"
module_path = "dlkit.domain.metrics"
extra_inputs = [{ key = "features.matrix", arg = "matrix" }]

[DATASET]
# Dataset uses PRE-NORMALIZED data from the data generation pipeline.
# Data is normalized during generation and saved as split arrays + manifest.
# NO additional transforms are applied during training to avoid double normalization.
# Features/targets are injected programmatically at runtime as path-based entries.
name = "FlexibleDataset"
memmap_cache = true

[DATAMODULE]

name = "InMemoryModule"

[DATAMODULE.dataloader]
num_workers = 0
batch_size = 32  # Reduced for small eigenvector dataset (504 samples → ~15 batches)
pin_memory = true
shuffle = true
[OPTUNA]
enabled = false
