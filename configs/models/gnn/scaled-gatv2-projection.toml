[SESSION]
seed = 42
workflow = "train"
precision = "float64"

[MODEL]
# Residual graph attention model.
name = "ScaledGATv2Projection"
module_path = "dlkit.domain.nn.graph"
hidden_size = 12
num_layers = 3
heads = 1
edge_dim = 1
concat = true
dropout = 0.0

[TRAINING.lr_tuner]
min_lr = 1e-5
max_lr = 1e-1
num_training = 100
mode = "linear"

[TRAINING.trainer]
max_epochs = 300
accelerator = "auto"
enable_checkpointing = true

[[TRAINING.trainer.callbacks]]
name = "ModelCheckpoint"
filename = "scaled-gatv2-projection"
monitor = "val_loss"
save_top_k = 1
save_weights_only = false
enable_version_counter = false

[[TRAINING.trainer.callbacks]]
name = "EarlyStopping"
monitor = "val_loss"
min_delta = 1e-4
patience = 30
mode = "min"
check_finite = true

[TRAINING.optimizer.default_optimizer]
name = "AdamW"
lr = 3e-4
weight_decay = 1e-2

[TRAINING.optimizer.default_scheduler]
name = "ReduceLROnPlateau"
mode = "min"
factor = 0.5
patience = 10
cooldown = 5
threshold = 1e-4
min_lr = 1e-6

[TRAINING.loss_function]
name = "normalized_vector_norm_loss"
module_path = "dlkit.domain.losses"
target_key = "targets.solutions"

[[TRAINING.metrics]]
name = "NormalizedVectorNormError"
module_path = "dlkit.domain.metrics"
norm_ord = 2
vector_dim = -1

[DATASET]
# Dataset uses PRE-NORMALIZED data from the data generation pipeline.
# Features/targets are injected programmatically at runtime as path-based entries.
name = "GraphDataset"

[DATAMODULE]
name = "GraphDataModule"

[DATAMODULE.dataloader]
num_workers = 0
batch_size = 32
pin_memory = true
shuffle = true

[OPTUNA]
enabled = false
n_trials = 40

[OPTUNA.model]
hidden_size = {low=2, high=100, step=10}
num_layers = {low=1, high=10, step=1}
drop = {low=0, high=0.5, step=0.1}
