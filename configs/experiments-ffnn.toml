# Residuals-only FFNN registry for model-family sweeps.

project_root = ".."
output_dir = "/data/projects/graph-cg/data/output"

[names]
training = "Train"
comparison = "Comparisons"

# -------
# Dataset
# -------

[[datasets]]
id = "residuals-100"
path = "datasets/residuals-100.toml"
