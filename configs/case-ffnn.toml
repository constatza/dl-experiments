# Residual FFNN registry for archive-backed and Gaussian residual sweeps.

[mlflow]
tracking_uri = "http://localhost:5000"

[names]
training   = "Train"
comparison = "Comparisons"

# ────────────────────────
# Comparison defaults
# ────────────────────────

[comparison_defaults]
rtol               = 1.0e-6
atol               = 1.0e-14
max_iterations     = 200
stopping_criterion = "residual_norm"
m_max              = 20

[[comparison_defaults.preconditioners]]
name = "none"
type = "identity"

[[comparison_defaults.preconditioners]]
name = "jacobi"
type = "jacobi"

[[comparison_defaults.preconditioners]]
name = "ic0"
type = "ic0"

# ───────────────────────
# Datasets
# ───────────────────────

[[datasets]]
id   = "residuals-100"
path = "datasets/residuals-100.toml"
display_name = "Residual-Error 100"

[[datasets]]
id   = "res-gaussian-100"
path = "datasets/res-gaussian-100.toml"
display_name = "Residual-Error 100 Gaussian"

[[datasets]]
id   = "res-gaussian-0"
path = "datasets/res-gaussian-0.toml"
display_name = "Residual-Error 0 Gaussian"

[[datasets]]
id   = "res-gaussian-10"
path = "datasets/res-gaussian-10.toml"
display_name = "Residual-Error 10 Gaussian"

[[datasets]]
id   = "res-gaussian-20"
path = "datasets/res-gaussian-20.toml"
display_name = "Residual-Error 20 Gaussian"

[[datasets]]
id   = "res-gaussian-50"
path = "datasets/res-gaussian-50.toml"
display_name = "Residual-Error 50 Gaussian"

[[datasets]]
id   = "res-gaussian-100-93x31"
path = "datasets/res-gaussian-100-93x31.toml"
display_name = "Residual-Error 100 Gaussian 93x31"

[[datasets]]
id   = "solutions"
path = "datasets/solutions.toml"
display_name = "Solutions"

[[datasets]]
id   = "gaussian-rhs"
path = "datasets/gaussian-rhs.toml"
display_name = "Gaussian RHS"

[[datasets]]
id   = "scaled-solutions"
path = "datasets/scaled-solutions.toml"
display_name = "Scaled Solutions"

[[datasets]]
id   = "sparse-rhs"
path = "datasets/sparse-rhs.toml"
display_name = "Sparse RHS"

[[datasets]]
id   = "eig-few-solutions-smallest"
path = "datasets/eig-few-solutions-smallest.toml"
display_name = "Eig Few Solutions Smallest"

[[datasets]]
id   = "eig-few-rhs-smallest"
path = "datasets/eig-few-rhs-smallest.toml"
display_name = "Eig Few RHS Smallest"

# ───────────────────────
# Models
# ───────────────────────

[[models]]
id   = "constant-width-factorized"
path = "models/skip-ffnn/constant-width-factorized.toml"
display_name = "Constant-Width Factorized"

[[models]]
id   = "embedded-factorized"
path = "models/skip-ffnn/embedded-factorized.toml"
display_name = "Embedded Factorized"

[[models]]
id   = "embedded-spd"
path = "models/skip-ffnn/embedded-spd.toml"
display_name = "Embedded SPD"

[[models]]
id   = "embedded-spd-factorized"
path = "models/skip-ffnn/embedded-spd-factorized.toml"
display_name = "Embedded SPD-Factorized"

# ───────────────────────────────────────────────────────────────────────────
# Comparisons  (data binding — methodology from [comparison_defaults] above)
# ───────────────────────────────────────────────────────────────────────────

[[comparisons]]
id             = "gaussian"
matrix_dataset = "solutions"
rhs_dataset    = "gaussian-rhs"
display_name   = "Gaussian RHS"

[[comparisons]]
id             = "scaled-solutions"
matrix_dataset = "solutions"
rhs_dataset    = "scaled-solutions"
