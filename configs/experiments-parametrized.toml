# Residual registry for archive-backed and Gaussian residual datasets.

project_root = ".."
output_dir = "${GRAPH_CG_OUTPUT_DIR}"

[names]
training = "Train"
comparison = "Comparisons"

# -------
# Dataset
# -------

[[datasets]]
id = "residuals-100"
path = "datasets/residuals-100.toml"
display_name = "Residual-Error 100"

[[datasets]]
id = "residuals-100-gaussian"
path = "datasets/residuals-100-gaussian.toml"
display_name = "Residual-Error 100 Gaussian"

