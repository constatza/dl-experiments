# Solver comparison config: All neural preconditioners + baselines on neutral test
#
# Neural preconditioners reference experiments by ID.
# Checkpoints are resolved from comparison_run.json produced by train-multiple.
#
# Usage:
#   uv run train-multiple configs/experiments.toml
#   uv run compare-preconditioners \
#     --solver-config configs/solvers/linear-compare-all-on-neutral-test.toml \
#     --comparison-run /data/projects/graph-cg/data/output/training/comparison_run.json

[general]
# Test on shared neutral dataset (x=ones, b=A@x)
matrix_path = "/data/projects/graph-cg/data/processed/neutral-tests/neutral-test-45x15-displacements/normalized.npz"
rhs_path = "/data/projects/graph-cg/data/processed/neutral-tests/neutral-test-45x15-displacements/normalized.npz"

# CG solver parameters
rtol = 1.0e-9
atol = 1.0e-14
max_iterations = 200
stopping_criterion = "residual_norm"
m_max = 10  # FCG(m) orthogonalization window size. Use -1 for full orthogonalization.
output_root = "/data/projects/graph-cg/data/output"

[general.comparisons]
tracking_uri      = "sqlite:////data/projects/graph-cg/data/comparisons/mlflow.db"
artifact_location = "/data/projects/graph-cg/data/comparisons/mlartifacts"

# ============================================================================
# BASELINE PRECONDITIONERS
# ============================================================================

[[solvers]]
name = "none"
type = "none"

[[solvers]]
name = "jacobi"
type = "jacobi"

[[solvers]]
name = "ic0"
type = "ic0"

# ============================================================================
# NEURAL PRECONDITIONERS (referenced by experiment ID)
# ============================================================================
# These reference experiments defined in experiments.toml
# Checkpoints are resolved from the experiment's checkpoint_path field

[[solvers]]
name = "neural_linear_test_solutions"
type = "neural"
experiment = "linear_test_solutions"  # References experiment.id from experiments.toml
limit_iters ig= 1
fallback = "identity"

[[solvers]]
name = "neural_linear_eigenvector_solutions_largest"
type = "neural"
experiment = "linear_test_eigenvector_solutions_largest"
limit_iters = 1
fallback = "identity"

[[solvers]]
name = "neural_linear_eigenvector_solutions_smallest"
type = "neural"
experiment = "linear_test_eigenvector_solutions_smallest"
limit_iters = 1
fallback = "identity"

[[solvers]]
name = "neural_linear_eigenvector_rhs_largest"
type = "neural"
experiment = "linear_test_eigenvector_rhs_largest"
limit_iters = 1
fallback = "identity"

[[solvers]]
name = "neural_linear_eigenvector_rhs_smallest"
type = "neural"
experiment = "linear_test_eigenvector_rhs_smallest"
limit_iters = 1
fallback = "identity"
