# Global path configuration
[paths]
output_root = "/data/projects/graph-cg/data/output"

# Experiment matrix for graph-cg preconditioner training
#
# Each experiment combines a model template with a data generation config.
# The workflow will:
# 1. Generate data according to the data_config
# 2. Train the model with paths automatically resolved to the generated data
#
# Data configs define:
# - Matrix dimensions (90, 280, 504, 2040)
# - Generation strategy (normal, krylov mix)
# - Normalization settings
#
# Model configs define:
# - Architecture (FFNN variants, GNN, Linear)
# - Training hyperparameters
# - Optimizer/scheduler settings

# Experiments: each model config trains on multiple data configs
# Output structure: {output_root}/{SESSION.name from model}/{data-config stem}/

#[[experiments]]
#model_template = "configs/linear.toml"
#data_config = "data-configs/generate-280-krylov50.toml"

[[experiments]]
model_template = "configs/linear.toml"
data_config = "data-configs/collect-504.toml"

[[experiments]]
model_template = "configs/linear.toml"
data_config = "data-configs/collect-504-solutions.toml"

