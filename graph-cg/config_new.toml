[SESSION]
# Human-readable run/session name (for logs and tracking)
name = "GraphCG-Krylov"
# Random seed for reproducibility
seed = 42
# Computation precision preset (e.g., medium, high)
precision = "medium"

[MODEL]
# Model class path - using new dlkit GATv2Projection
name = "GATv2Projection"
module_path = "dlkit.nn.graph.projection"
hidden_size = 16
num_layers = 12
#dropout = 0.1

[TRAINING]
# Number of epochs for convenience

[TRAINING.trainer]
# Maximum number of epochs (Lightning Trainer)
max_epochs = 300
# Hardware accelerator: cpu | gpu | auto | tpu
accelerator = "auto"
# Enable checkpointing
enable_checkpointing = false
# Default root directory for trainer outputs
default_root_dir = "./outputs"

[TRAINING.optimizer]
# Optimizer name and settings
name = "RAdam"
lr = 1e-2

[TRAINING.scheduler]
name = "ReduceLROnPlateau"
factor = 0.5
patience = 30
min_lr = 1e-6

[DATAMODULE]
# DataModule class for graph data
name = "GraphDataModule"

[DATAMODULE.dataloader]
num_workers = 5
batch_size = 64
persistent_workers = true
pin_memory = true
shuffle = true


[DATASET]
# Graph dataset class
name = "GraphDataset"
# Graph data paths (absolute paths to avoid resolution issues)
root = "/data/projects/graph-cg/data/"
x = "/data/projects/graph-cg/data/raw/Scc_assembly_no_0_column_no_0_Krr-rhs.npy"
y = "/data/projects/graph-cg/data/raw/Scc_assembly_no_0_column_no_0_Krr-solution.npy"
edge_index = "/data/projects/graph-cg/data/raw/Scc_assembly_no_0_column_no_0_Krr.txt"

[DATASET.split]
val_ratio = 0.15
test_ratio = 0.15

[MLFLOW]
# Enable MLflow tracking
enabled = false

[MLFLOW.server]
# MLflow server configuration
backend_store_uri = "@format sqlite:///{this.paths.mlruns_dir}/mlflow.db"
artifacts_destination = "@format file:///{this.paths.mlruns_dir}/artifacts"

[MLFLOW.client]
# MLflow client configuration
experiment_name = "GraphCG-Krylov"


[OPTUNA]
# Hyperparameter optimization settings
enabled = false
n_trials = 100

[PATHS]
# Base directory for resolving relative paths
root_dir = "/data/projects/graph-cg"
# Input data directory
data_dir = "./data"
# Output directory for artifacts/logs
output_dir = "./outputs"
mlruns_dir = "./mlruns"