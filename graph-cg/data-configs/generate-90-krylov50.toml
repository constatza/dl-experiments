# Data generation config for 90-dimensional system with 50% krylov strategy
# Usage: uv run python generate_data.py data-configs/generate-90-krylov50.toml
# Output: generate-90-krylov50-norm/ (krylov tag added when krylov > 0)

[flow]

[source]
matrix_path = "/data/projects/graph-cg/data/raw/matrix-90.txt"
rhs_path = "/data/projects/graph-cg/data/raw/rhs-90.txt"

[generation]
# Number of samples to generate
num_samples = 3000

# Normalization method: "spectral", "matrix", "rhs", or "none"
# - "matrix": normalizes by spectral radius bound
# - "rhs": normalizes each (A, b) pair by ||b||
# - "none": no normalization
normalize = "spectral"

# CG iterations for krylov strategy
krylov_iters = 15
# CG iterations captured for residual traces (used when mix includes cg_residual/residual)
# residual_iters = 12

# Random seed for reproducibility
seed = 42

# Shuffle final dataset
shuffle = true

[[generation.strategy]]
name = "normal"
percentage = 0.5

[[generation.strategy]]
name = "krylov"
percentage = 0.5
krylov_iters = 15

[output]
# Base directory for processed data
processed_dir = "/data/projects/graph-cg/data/processed"
# Actual output will be: {processed_dir}/generate-90-krylov50-norm/
