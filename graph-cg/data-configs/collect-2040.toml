# Data collection config for SpectralData 93x31 case (2040-dimensional system)
# Usage: uv run python collect_data.py data-configs/collect-2040.toml
# Output: collect-2040-norm/ (no krylov tag for RHS archive data)

[flow]

[source]
matrix_path = "/data/projects/graph-cg/data/raw/SpectralData/93x31/stiffness/subdomain_1_Kaa.txt"
rhs_path = "/data/projects/graph-cg/data/raw/SpectralData/93x31/faVectorsFromSpectral/fa_from_spectral_no_realization_*.txt"

[generation]
# Normalization method: "spectral", "matrix", "rhs", or "none"
# - "matrix": normalizes by spectral radius bound, creates identical matrices per sample
# - "rhs": normalizes each (A, b) pair by ||b||, creates different matrices per sample
# - "none": no normalization
normalize = "spectral"

[[generation.strategy]]
name = "rhs_archive"
percentage = 1.0
rhs_glob = "/data/projects/graph-cg/data/raw/SpectralData/93x31/faVectorsFromSpectral/fa_from_spectral_no_realization_*.txt"

[output]
# Base directory for processed data
processed_dir = "/data/projects/graph-cg/data/processed"
# Actual output will be: {processed_dir}/collect-2040-norm/
