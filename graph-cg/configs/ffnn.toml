[SESSION]
seed = 42
precision = "float64"

[MODEL]
# NormScaled linear FFNN with layer normalization
name = "NormScaledConstantWidthFFNN"
module_path = "dlkit.nn.ffnn"
hidden_size = 500
num_layers = 3
# checkpoint path is managed dynamically by workflow - no hardcoded path needed

[TRAINING]
# Checkpoint to resume training from (full training state: model + optimizer + scheduler + epoch)
# Comment out if starting fresh training
# resume_from_checkpoint = "/data/projects/graph-cg/data/output/checkpoints/ffnn-normscaled.ckpt"
[TRAINING.lr_tuner]
min_lr = 1e-5
max_lr = 1e-2
num_training = 100
mode = "linear"


[TRAINING.trainer]
max_epochs = 800
accelerator = "auto"
enable_checkpointing = true


[[TRAINING.trainer.callbacks]]
name = "ModelCheckpoint"
filename = "ffnn"
monitor = "val_loss"
save_top_k = 1
save_weights_only = false
every_n_epochs = 50
enable_version_counter = false

[TRAINING.optimizer]
lr = 1e-2

[TRAINING.scheduler]
name = "ReduceLROnPlateau"
factor = 0.5
patience = 30
min_lr = 1e-14

[[TRAINING.metrics]]
name = "NormalizedVectorNormError"
module_path = "dlkit.core.training.metrics"
norm_ord = 2
vector_dim = -1

[DATAMODULE]
name = "InMemoryModule"

[DATAMODULE.dataloader]
num_workers = 0
batch_size = 256
pin_memory = true
shuffle = true

[MLFLOW]
enabled = true

[MLFLOW.server]
# MLflow storage paths under data directory
backend_store_uri = "sqlite:////data/projects/graph-cg/data/mlruns/mlflow.db"
artifacts_destination = "/data/projects/graph-cg/data/mlartifacts"

[OPTUNA]
enabled = false

[EXTRAS]
# Solver parameters for CG comparison
[EXTRAS.solver]
tolerance = 1e-8
max_iterations = 30
stopping_criterion = "tolerance"
