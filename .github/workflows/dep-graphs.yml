name: Dependency Graphs

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-target-matrix:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: latest
          save-cache: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Python
        run: uv python install 3.14

      - name: Synchronize dependencies
        run: uv sync --dev

      - id: targets
        name: Define graph targets
        run: |
          targets='[
            {"name":"overview","dot":"docs/neuralls/diagrams/overview.dot","svg":"overview.svg","root":"neuralls","context":""},
            {"name":"cli","dot":"docs/neuralls/diagrams/cli.dot","svg":"cli.svg","root":"neuralls.cli","context":"neuralls.composition,neuralls.shared"},
            {"name":"application","dot":"docs/neuralls/diagrams/application.dot","svg":"application.svg","root":"neuralls.application","context":"neuralls.domain,neuralls.shared"},
            {"name":"composition","dot":"docs/neuralls/diagrams/composition.dot","svg":"composition.svg","root":"neuralls.composition","context":"neuralls.application,neuralls.platform,neuralls.domain,neuralls.shared"},
            {"name":"domain","dot":"docs/neuralls/diagrams/domain.dot","svg":"domain.svg","root":"neuralls.domain","context":"neuralls.shared"},
            {"name":"platform","dot":"docs/neuralls/diagrams/platform.dot","svg":"platform.svg","root":"neuralls.platform","context":"neuralls.domain,neuralls.shared"},
            {"name":"shared","dot":"docs/neuralls/diagrams/shared.dot","svg":"shared.svg","root":"neuralls.shared","context":""}
          ]'
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"

  render-target-graphs:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: prepare-target-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare-target-matrix.outputs.targets) }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: latest
          save-cache: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Python
        run: uv python install 3.14

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Synchronize dependencies
        run: uv sync --dev

      - name: Check Tach boundaries
        run: uv run tach check

      - name: Regenerate tracked DOT graph for ${{ matrix.target.name }}
        run: |
          uv run tach map -o /tmp/neuralls-map.json
          uv run python scripts/render_actual_dependency_graph.py /tmp/neuralls-map.json ${{ matrix.target.dot }} ${{ matrix.target.root }} "${{ matrix.target.context }}"

      - name: Render SVG artifact for ${{ matrix.target.name }}
        run: |
          mkdir -p .tmp/dgraphs
          dot -Tsvg ${{ matrix.target.dot }} -o .tmp/dgraphs/${{ matrix.target.svg }}

      - name: Upload SVG artifact for ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph-${{ matrix.target.name }}-svg
          path: .tmp/dgraphs
          if-no-files-found: error

  verify-tracked-graphs:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: render-target-graphs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: latest
          save-cache: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Set up Python
        run: uv python install 3.14

      - name: Synchronize dependencies
        run: uv sync --dev

      - name: Check Tach boundaries
        run: uv run tach check

      - name: Regenerate tracked DOT graphs
        run: |
          uv run tach map -o /tmp/neuralls-map.json
          uv run python scripts/render_actual_dependency_graph.py /tmp/neuralls-map.json docs/neuralls/diagrams/overview.dot neuralls
          uv run python scripts/render_actual_dependency_graph.py /tmp/neuralls-map.json docs/neuralls/diagrams/cli.dot neuralls.cli neuralls.composition,neuralls.shared
          uv run python scripts/render_actual_dependency_graph.py /tmp/neuralls-map.json docs/neuralls/diagrams/application.dot neuralls.application neuralls.domain,neuralls.shared
          uv run python scripts/render_actual_dependency_graph.py /tmp/neuralls-map.json docs/neuralls/diagrams/composition.dot neuralls.composition neuralls.application,neuralls.platform,neuralls.domain,neuralls.shared
          uv run python scripts/render_actual_dependency_graph.py /tmp/neuralls-map.json docs/neuralls/diagrams/domain.dot neuralls.domain neuralls.shared
          uv run python scripts/render_actual_dependency_graph.py /tmp/neuralls-map.json docs/neuralls/diagrams/platform.dot neuralls.platform neuralls.domain,neuralls.shared
          uv run python scripts/render_actual_dependency_graph.py /tmp/neuralls-map.json docs/neuralls/diagrams/shared.dot neuralls.shared

      - name: Verify tracked graphs are up to date
        run: git diff --exit-code -- docs/neuralls/diagrams
